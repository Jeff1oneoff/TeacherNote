<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Репетитор</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f9f5;
            color: #1a2e1a;
            max-width: 430px;
            margin: 0 auto;
            padding: 0 0 100px 0;
            min-height: 100vh;
        }
        .header {
            padding: 20px 20px 10px 20px;
            background: white;
            border-bottom: 1px solid #e8f0e8;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #2D6A4F;
            letter-spacing: -0.5px;
        }
        .header-title span { color: #52B788; }
        .header-badge {
            background: #2D6A4F;
            color: white;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 500;
        }
        .header-subtitle {
            font-size: 13px;
            color: #6b8a6b;
            margin-top: 4px;
        }
        .auto-status {
            font-size: 12px;
            color: #52B788;
            padding: 6px 14px;
            background: #e8f5ec;
            border-radius: 20px;
            text-align: center;
            display: inline-block;
            margin: 4px auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 16px;
            box-shadow: 0 2px 12px rgba(45, 106, 79, 0.08);
            border: 1px solid #e8f0e8;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a2e1a;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .btn:hover { opacity: 0.9; transform: scale(0.98); }
        .btn-primary { background: #2D6A4F; color: white; }
        .btn-success { background: #52B788; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-secondary { background: #e8f0e8; color: #2D6A4F; }
        .btn-small { padding: 6px 14px; font-size: 13px; width: auto; margin: 4px; border-radius: 8px; }
        .input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8f0e8;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 10px;
            background: #fafffa;
            transition: all 0.2s;
        }
        .input:focus {
            outline: none;
            border-color: #52B788;
            box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
        }
        .input::placeholder { color: #a0b8a0; }
        .input-small {
            width: 80px;
            padding: 10px 12px;
            border: 2px solid #e8f0e8;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            text-align: center;
        }
        .label {
            font-size: 13px;
            font-weight: 600;
            color: #3a5a3a;
            margin-bottom: 4px;
            display: block;
        }
        .text-muted { color: #6b8a6b; font-size: 13px; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .mt-8 { margin-top: 8px; }
        .student-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f5f0;
            cursor: pointer;
        }
        .student-card:last-child { border-bottom: none; }
        .student-card:hover {
            background: #f8fcf8;
            margin: 0 -8px;
            padding: 14px 8px;
            border-radius: 8px;
        }
        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .student-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e8f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #2D6A4F;
        }
        .student-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a2e1a;
        }
        .student-details { font-size: 13px; color: #6b8a6b; }
        .student-badges {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 12px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 500;
            background: #e8f0e8;
            color: #3a5a3a;
        }
        .badge-green { background: #2D6A4F; color: white; }
        .badge-yellow { background: #f39c12; color: white; }
        .badge-red { background: #e74c3c; color: white; }
        .badge-light { background: #e8f0e8; color: #3a5a3a; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #6b8a6b;
            padding: 6px 0;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #fafffa;
            font-size: 14px;
            font-weight: 500;
            color: #1a2e1a;
            transition: all 0.2s;
            position: relative;
            min-height: 40px;
            cursor: default;
            border: 1px solid transparent;
        }
        .calendar-day.empty { background: transparent; border: none; }
        .calendar-day.has-lessons {
            background: #2D6A4F;
            color: white;
            cursor: pointer;
        }
        .calendar-day.has-lessons:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(45, 106, 79, 0.3);
        }
        .calendar-day.has-note { border: 2px solid #f39c12; }
        .calendar-day.today { border: 2px solid #52B788; }
        .calendar-day .day-number { font-size: 14px; font-weight: 600; }
        .calendar-day .lesson-count {
            font-size: 8px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 0 6px;
            margin-top: 1px;
        }
        .calendar-day .note-indicator {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
        }
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-nav button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 14px;
            border-radius: 8px;
            color: #2D6A4F;
            font-weight: 600;
        }
        .calendar-nav button:hover { background: #e8f0e8; }
        .calendar-nav .month-label {
            font-size: 16px;
            font-weight: 600;
            color: #1a2e1a;
        }
        .calendar-legend {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            font-size: 11px;
            color: #6b8a6b;
            justify-content: center;
            flex-wrap: wrap;
        }
        .calendar-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .calendar-legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
            background: #2D6A4F;
        }
        .calendar-legend-dot.today-dot { border: 2px solid #52B788; background: white; }
        .calendar-legend-dot.note-dot { background: #f39c12; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.hidden { display: none !important; }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            color: #1a2e1a;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .modal-btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .modal-btn:hover { opacity: 0.9; transform: scale(0.98); }
        .modal-btn-done { background: #52B788; color: white; }
        .modal-btn-reschedule { background: #f39c12; color: white; }
        .modal-btn-cancel { background: #e74c3c; color: white; }
        .modal-btn-close { background: #e8f0e8; color: #1a2e1a; }

        /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 410px;
            width: calc(100% - 24px);
            background: white;
            border-radius: 28px;
            box-shadow: 0 4px 24px rgba(45, 106, 79, 0.18);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 4px;
            z-index: 100;
            border: 1px solid #e8f0e8;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            color: #a0b8a0;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s;
            position: relative;
            flex: 1;
            border-radius: 16px;
        }
        .nav-item .nav-icon {
            font-size: 20px;
            line-height: 1;
        }
        .nav-item.active {
            color: #2D6A4F;
        }
        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }
        .nav-plus {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #2D6A4F;
            color: white;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(45, 106, 79, 0.4);
            transition: all 0.2s;
            flex-shrink: 0;
            margin: 0 4px;
        }
        .nav-plus:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(45, 106, 79, 0.5);
        }
        .nav-plus:active {
            transform: scale(0.95);
        }

        .hidden { display: none !important; }
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f5f0;
            cursor: pointer;
            flex-wrap: wrap;
            gap: 4px;
        }
        .lesson-item:hover {
            background: #f8fcf8;
            margin: 0 -8px;
            padding: 10px 8px;
            border-radius: 8px;
        }
        .lesson-item:last-child { border-bottom: none; }
        .lesson-date {
            font-size: 14px;
            color: #1a2e1a;
            flex: 1;
            min-width: 120px;
        }
        .lesson-status-done { color: #52B788; text-decoration: line-through; }
        .lesson-status-canceled { color: #e74c3c; text-decoration: line-through; }
        .lesson-status-rescheduled { color: #f39c12; }
        .day-chip-active {
            background: #2D6A4F;
            color: white;
            padding: 6px 14px;
            border-radius: 16px;
            border: none;
            font-size: 13px;
            cursor: default;
            display: inline-block;
            margin: 3px;
        }
        .day-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }
        .week-info {
            text-align: center;
            font-size: 13px;
            color: #6b8a6b;
            padding: 8px;
            background: #f5faf5;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }
        .filter-btn {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #e8f0e8;
            background: white;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            color: #6b8a6b;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #2D6A4F;
            color: white;
            border-color: #2D6A4F;
        }
        .subscription-box {
            background: #f5faf5;
            border-radius: 12px;
            padding: 14px 16px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #e8f0e8;
        }
        .subscription-box .count {
            font-size: 28px;
            font-weight: 700;
            color: #1a2e1a;
        }
        .subscription-box .count.warning { color: #f39c12; }
        .subscription-box .count.danger { color: #e74c3c; }
        .subscription-box .count.good { color: #2D6A4F; }
        .btn-close-modal {
            background: #e8f0e8;
            color: #1a2e1a;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .btn-close-modal:hover { opacity: 0.8; }
        .day-schedule-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
            padding: 6px 10px;
            background: #fafffa;
            border-radius: 10px;
            justify-content: space-between;
            border: 1px solid #f0f5f0;
        }
        .day-schedule-item .day-name { font-weight: 600; min-width: 30px; color: #1a2e1a; }
        .day-schedule-item .day-details { flex: 1; font-size: 12px; color: #6b8a6b; }
        .day-schedule-item .day-actions { display: flex; gap: 4px; }
        .slot-times { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .slot-time-tag {
            background: #e8f0e8;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #3a5a3a;
        }
        .btn-add-day {
            padding: 6px 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #52B788;
            color: white;
            min-width: 36px;
        }
        .btn-remove-day {
            padding: 6px 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            min-width: 36px;
        }
        .count-selector {
            background: #f5faf5;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            border: 1px solid #e8f0e8;
        }
        .time-slots {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0;
        }
        .time-slot-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #fafffa;
            border-radius: 10px;
            border: 1px solid #e8f0e8;
        }
        .time-slot-item select {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e8f0e8;
            font-size: 14px;
            background: white;
        }
        .btn-add-slot {
            padding: 4px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #52B788;
            color: white;
        }
        .btn-remove-slot {
            padding: 4px 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #e74c3c;
            color: white;
        }
        .info-text {
            font-size: 13px;
            color: #6b8a6b;
            background: #f5faf5;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8f0e8;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 10px;
            background: #fafffa;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }
        .textarea:focus {
            outline: none;
            border-color: #52B788;
            box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
        }

        /* ===== ГЛАВНАЯ ===== */
        .date-header {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            letter-spacing: 0.5px;
            padding: 0 4px 8px 4px;
            text-transform: uppercase;
        }
        .free-day-card {
            background: linear-gradient(135deg, #ffffff 0%, #fafffa 100%);
            border-radius: 20px;
            padding: 24px;
            margin: 12px 16px;
            border: 1px solid #e8f0e8;
            box-shadow: 0 2px 12px rgba(45, 106, 79, 0.06);
        }
        .free-day-title {
            font-size: 28px;
            font-weight: 800;
            color: #2D6A4F;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .free-day-title.busy {
            color: #2D6A4F;
        }
        .free-day-subtitle {
            font-size: 14px;
            color: #6b8a6b;
            line-height: 1.4;
        }
        .free-day-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .free-day-badge {
            background: #e8f0e8;
            color: #3a5a3a;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .income-card {
            background: #2D6A4F;
            border-radius: 20px;
            padding: 20px;
            margin: 12px 16px;
            color: white;
            box-shadow: 0 4px 20px rgba(45, 106, 79, 0.25);
        }
        .income-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .income-card-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.8;
            text-transform: uppercase;
        }
        .income-card-link {
            font-size: 13px;
            opacity: 0.9;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .income-card-amount {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }
        .income-card-amount .currency {
            font-size: 20px;
            font-weight: 600;
            opacity: 0.7;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 16px;
        }
        .mini-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #e8f0e8;
            box-shadow: 0 2px 12px rgba(45, 106, 79, 0.06);
            min-height: 160px;
            display: flex;
            flex-direction: column;
        }
        .mini-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .mini-card-title {
            font-size: 11px;
            font-weight: 700;
            color: #8e8e93;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.3;
        }
        .mini-card-plus {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #2D6A4F;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .mini-card-plus:hover {
            background: #1e4d38;
            transform: scale(1.1);
        }
        .mini-card-empty {
            font-size: 13px;
            color: #a0b8a0;
            margin-top: auto;
        }
        .diary-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .diary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #f5f9f5;
        }
        .diary-item:last-child {
            border-bottom: none;
        }
        .diary-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .diary-dot.red { background: #e74c3c; }
        .diary-dot.green { background: #52B788; }
        .diary-dot.blue { background: #3498db; }
        .diary-text {
            flex: 1;

        // ============================================================
        // 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function formatDate(dateString) {
            var parts = dateString.split('-');
            return parts[2] + '-' + parts[1] + '-' + parts[0];
        }
        function lessonToDate(lesson) {
            return new Date(lesson.date + 'T' + lesson.time + ':00');
        }
        function getStatusText(status) {
            if (status === LESSON_STATUS.DONE) return '✅ Проведен';
            if (status === LESSON_STATUS.CANCELED) return '❌ Отменен';
            if (status === LESSON_STATUS.RESCHEDULED) return '⏳ Перенесен';
            return '📅 Запланирован';
        }
        function getMondayBasedDay(date) {
            var day = date.getDay();
            return day === 0 ? 6 : day - 1;
        }
        function generateLessons(schedule, weeksAhead) {
            var lessons = [];
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var currentDay = today.getDay();
            var diffToMonday = currentDay === 0 ? 6 : currentDay - 1;
            var monday = new Date(today);
            monday.setDate(today.getDate() - diffToMonday);
            monday.setHours(0, 0, 0, 0);
            var totalDays = 7 * weeksAhead;
            for (var i = 0; i < totalDays; i++) {
                var d = new Date(monday);
                d.setDate(monday.getDate() + i);
                var dayOfWeek = getMondayBasedDay(d);
                var match = null;
                for (var j = 0; j < schedule.length; j++) {
                    if (schedule[j].day === dayOfWeek) { match = schedule[j]; break; }
                }
                if (!match) continue;
                var dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                var times = match.times || [];
                for (var c = 0; c < times.length; c++) {
                    var timeStr = times[c];
                    var lessonDate = new Date(dateStr + 'T' + timeStr + ':00');
                    if (lessonDate.getTime() >= today.getTime() - 24 * 60 * 60 * 1000) {
                        lessons.push({
                            id: dateStr + '-' + match.day + '-' + c,
                            date: dateStr,
                            time: timeStr
                        });
                    }
                }
            }
            lessons.sort(function(a, b) {
                if (a.date === b.date) return a.time.localeCompare(b.time);
                return a.date.localeCompare(b.date);
            });
            return lessons;
        }
        function sendVkMessage(userId, message) {

                    v: '5.131',
                    random_id: Math.floor(Math.random() * 1000000000)
                })
            }).catch(function(e) {});
        }

        // ============================================================

        // ============================================================

        async function deleteStudent(id) {
            if (!confirm('Удалить ученика?')) return;
            try {
                var result = await supabaseClient.from('students').delete().eq('id', id);
                if (result.error) { alert('Ошибка: ' + result.error.message); return; }

        // ============================================================
        // 6. МОДАЛКА УЧЕНИКА
        // ============================================================
        function openStudentModal(student) {
            selectedStudent = student;
            document.getElementById('studentModal').classList.remove('hidden');
            renderStudentModal();
        }
        function closeStudentModal() {
            document.getElementById('studentModal').classList.add('hidden');

            editAddDay = null;
            editAddTimes = ['15:00'];
        }
        function renderStudentModal() {
            if (!selectedStudent) return;
            var student = selectedStudent;
            var subscription = student.subscription_lessons || 0;
            var countClass = 'count good';
            if (subscription === 0) countClass = 'count danger';
            else if (subscription <= 3) countClass = 'count warning';
            var allLessons = generateLessons(student.schedule || [], 1);
            var statuses = student.lesson_statuses || {};
            var lessonsWithStatus = [];
            for (var l = 0; l < allLessons.length; l++) {
                var lesson = allLessons[l];
                var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                lessonsWithStatus.push({ id: lesson.id, date: lesson.date, time: lesson.time, status: status });
            }
            var filteredLessons = lessonsWithStatus;
            if (statusFilter !== 'all') {
                filteredLessons = lessonsWithStatus.filter(function(l) { return l.status === statusFilter; });
            }
            var html = '';
            html += '<div class="flex-between">';
            html += '<h2 class="card-title" style="font-size:20px;">' + (student.name || 'Без имени') + '</h2>';
            html += '<button class="btn btn-secondary btn-small" onclick="closeStudentModal()">✕</button>';
            html += '</div>';
            html += '<div style="margin-top:8px;"><span class="label">VK ID:</span>';

            html += '<button class="btn btn-warning btn-small" onclick="editSubscription(\'' + student.id + '\')" style="margin:0;">✏️</button>';

            var schedule = student.schedule || [];
            html += '<div class="mt-8">';
            html += '<div class="flex-between">';
            html += '<span class="label">Расписание:</span>';
            html += '<button class="btn btn-secondary btn-small" onclick="toggleScheduleEdit()">' + (editAddDay !== null ? '✅ Готово' : '✏️ Настроить') + '</button>';
            html += '</div>';
            if (editAddDay !== null || schedule.length > 0) {
                if (editAddDay === null && schedule.length > 0) {
                    html += '<div class="day-row">';
                    for (var d = 0; d < schedule.length; d++) {

                        var times = (item.times || []).join(', ');

                    html += '</div>';
                } else {

                    for (var di = 0; di < allDays.length; di++) {
                        var dayNum = allDays[di];

                        var isAdded = scheduleItem !== null;
                        html += '<div class="day-schedule-item" style="' + (isAdded ? '' : 'opacity:0.6;') + '">';
                        html += '<span class="day-name">' + dayName + '</span>';
                        html += '<span class="day-details">';
                        if (isAdded) {
                            html += '<div class="slot-times">';
                            for (var t = 0; t < (scheduleItem.times || []).length; t++) {
                                html += '<span class="slot-time-tag">' + scheduleItem.times[t] + '</span>';

                        html += '</div>';
                        html += '</div>';
                    }
                    html += '</div>';
                    if (editAddDay !== null && editAddDay >= 0) {

        // ============================================================

            editAddTimes.splice(index, 1);
            if (editAddTimes.length === 0) editAddTimes = ['15:00'];

            editAddTimes[index] = value;

        async function confirmAddDay(studentId) {
            if (editAddDay === null || editAddDay < 0) return;
            var student = students.find(function(s) { return s.id === studentId; });
            if (!student) return;
            var schedule = student.schedule || [];
            var exists = false;
            for (var k = 0; k < schedule.length; k++) {
                if (schedule[k].day === editAddDay) { exists = true; break; }
            }
            if (exists) { alert('⚠️ Этот день уже добавлен!'); return; }
            var uniqueTimes = editAddTimes.filter(function(v, i, a) { return a.indexOf(v) === i; });
            uniqueTimes.sort();
            var newSchedule = schedule.concat([{ day: editAddDay, times: uniqueTimes }]);
            try {
                var result = await supabaseClient.from('students').update({ schedule: newSchedule }).eq('id', studentId);
                if (result.error) { alert('Ошибка: ' + result.error.message); return; }
                editAddDay = -1;
                editAddTimes = ['15:00'];
                await refreshData();
                alert('✅ День добавлен!');
            } catch (error) { alert('Ошибка: ' + error.message); }
        }
        async function removeDayFromSchedule(studentId, day) {
            if (!confirm('Удалить день ' + DAY_NAMES[day] + '?')) return;
            var student = students.find(function(s) { return s.id === studentId; });
            if (!student) return;
            var schedule = student.schedule || [];
            var newSchedule = schedule.filter(function(s) { return s.day !== day; });
            try {
                var result = await supabaseClient.from('students').update({ schedule: newSchedule }).eq('id', studentId);
                if (result.error) { alert('Ошибка: ' + result.error.message); return; }
                await refreshData();
                alert('✅ День удален!');
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

        function editSubscription(studentId) {

            var newCount = prompt('Введите количество занятий по абонементу:', current);

        // ============================================================
        // 9. СТАТУС УРОКОВ
        // ============================================================
        async function changeLessonStatus(studentId, lessonId, newStatus) {
            var student = students.find(function(s) { return s.id === studentId; });
            if (!student) return;
            var statuses = student.lesson_statuses || {};
            var currentStatus = statuses[lessonId] || LESSON_STATUS.SCHEDULED;
            var subscriptionCount = student.subscription_lessons || 0;
            var needNotify = false;
            if (newStatus === LESSON_STATUS.DONE && currentStatus !== LESSON_STATUS.DONE) {
                if (subscriptionCount > 0) {
                    subscriptionCount--;
                    if (subscriptionCount === 0) needNotify = true;
                }
            }
            if (newStatus === LESSON_STATUS.SCHEDULED) { delete statuses[lessonId]; }
            else { statuses[lessonId] = newStatus; }
            try {
                var updateData = { lesson_statuses: statuses };
                if (needNotify) { updateData.subscription_lessons = 0; }
                var result = await supabaseClient.from('students').update(updateData).eq('id', studentId);
                if (result.error) { alert('Ошибка: ' + result.error.message); return; }
                if (needNotify && student.vk_user_id) {
                    var message = '❌ Ваш абонемент на занятия закончился!\n\nЧтобы продолжить занятия, пожалуйста, оплатите новый абонемент.\n\nСпасибо! 🙏';
                    sendVkMessage(student.vk_user_id, message);
                    sendVkMessage(TUTOR_VK_ID, '🔔 Абонемент закончился у ученика ' + student.name);
                }
                await refreshData();
                closeStatusModal();
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

            var student = selectedStudent;

            var lesson = { id: lessonId, date: date, time: time };

        // ============================================================
        // 10. НАПОМИНАНИЯ
        // ============================================================
        async function enableReminders() {
            if (!selectedStudent) return;
            var student = selectedStudent;
            var lessons = generateLessons(student.schedule || [], 1);
            var statuses = student.lesson_statuses || {};
            var futureLessons = lessons.filter(function(l) {
                var status = statuses[l.id] || LESSON_STATUS.SCHEDULED;
                return status === LESSON_STATUS.SCHEDULED;
            });
            if (futureLessons.length === 0) { alert('⚠️ Нет запланированных занятий на эту неделю'); return; }
            var count = 0;
            for (var i = 0; i < futureLessons.length; i++) {
                var l = futureLessons[i];
                var lessonDate = lessonToDate(l);
                var reminderDate = new Date(lessonDate.getTime() - 60 * 60 * 1000);
                if (reminderDate.getTime() > Date.now()) {
                    sendVkMessage(TUTOR_VK_ID, '🔔 Напоминание: занятие с ' + student.name + ' в ' + l.time + ' (' + formatDate(l.date) + ')');
                    if (student.vk_user_id) {
                        sendVkMessage(student.vk_user_id, 'Напоминаем, что через 60 минут начнется занятие по русскому языку в ' + l.time);
                    }
                    count++;
                }
            }
            try {
                var result = await supabaseClient.from('students').update({ reminders_on: true }).eq('id', student.id);
                if (result.error) { alert('Ошибка: ' + result.error.message); return; }
                await refreshData();
                alert('✅ Запланировано напоминаний: ' + count);
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

        // ============================================================
        // 13. РЕНДЕРИНГ
        // ============================================================
        function getWeekInfo() {
            var today = new Date();
            var currentDay = today.getDay();
            var diff = today.getDate() - (currentDay === 0 ? 6 : currentDay - 1);
            var monday = new Date(today);
            monday.setDate(diff);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            var options = { day: 'numeric', month: 'long' };
            return '📅 ' + monday.toLocaleDateString('ru-RU', options) + ' - ' + sunday.toLocaleDateString('ru-RU', options);
        }
        function renderCalendar() {
            var year = calendarDate.getFullYear();
            var month = calendarDate.getMonth();
            var firstDayOfMonth = new Date(year, month, 1);
            var lastDayOfMonth = new Date(year, month + 1, 0);
            var daysInMonth = lastDayOfMonth.getDate();
            var startDayOfWeek = getMondayBasedDay(firstDayOfMonth);
            var allLessons = {};
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                var schedule = student.schedule || [];
                var lessons = generateLessons(schedule, 4);
                var statuses = student.lesson_statuses || {};
                for (var l = 0; l < lessons.length; l++) {
                    var lesson = lessons[l];
                    var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                    if (status === LESSON_STATUS.SCHEDULED || status === LESSON_STATUS.RESCHEDULED) {
                        if (!allLessons[lesson.date]) allLessons[lesson.date] = [];
                        allLessons[lesson.date].push({
                            student: student.name,
                            time: lesson.time,
                            status: status
                        });
                    }
                }
            }
            var notes = JSON.parse(localStorage.getItem('calendar_notes') || '{}');
            var today = new Date();
            var todayStr = today.toISOString().slice(0, 10);
            var html = '<div class="card">';
            html += '<div class="calendar-nav">';
            html += '<button onclick="changeMonth(-1)">‹</button>';
            html += '<span class="month-label">' + MONTH_NAMES_NOM[month] + ' ' + year + '</span>';
            html += '<button onclick="changeMonth(1)">›</button>';
            html += '</div>';
            html += '<div class="calendar-grid">';
            for (var d = 0; d < 7; d++) {
                html += '<div class="calendar-day-header">' + DAY_NAMES[d] + '</div>';
            }
            for (var i = 0; i < startDayOfWeek; i++) {
                html += '<div class="calendar-day empty"></div>';
            }
            for (var day = 1; day <= daysInMonth; day++) {
                var dateObj = new Date(year, month, day);
                var dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                var isToday = dateStr === todayStr;
                var hasLessons = allLessons[dateStr] && allLessons[dateStr].length > 0;
                var lessonCount = hasLessons ? allLessons[dateStr].length : 0;
                var lessonInfo = hasLessons ? allLessons[dateStr] : [];
                var hasNote = notes[dateStr] && notes[dateStr].trim() !== '';
                var classes = 'calendar-day';
                if (hasLessons) classes += ' has-lessons';
                if (hasNote) classes += ' has-note';
                if (isToday) classes += ' today';
                html += '<div class="' + classes + '" onclick="openDayModal(\'' + dateStr + '\', ' + JSON.stringify(lessonInfo).replace(/"/g, '&quot;') + ')">';
                html += '<span class="day-number">' + day + '</span>';
                if (hasLessons) html += '<span class="lesson-count">' + lessonCount + '</span>';
                if (hasNote) html += '<span class="note-indicator">📝</span>';
                html += '</div>';
            }
            html += '</div>';
            html += '<div class="calendar-legend">';
            html += '<span class="calendar-legend-item"><span class="calendar-legend-dot"></span> Занятия</span>';
            html += '<span class="calendar-legend-item"><span class="calendar-legend-dot today-dot"></span> Сегодня</span>';
            html += '<span class="calendar-legend-item"><span class="calendar-legend-dot note-dot"></span> Заметка</span>';
            html += '</div>';
            html += '</div>';
            return html;
        }
        function renderStudentList() {
            if (!students || students.length === 0) {
                return '<div class="text-muted" style="text-align:center;padding:20px;">🌱 Добавьте первого ученика</div>';
            }
            var html = '';
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                var subscription = student.subscription_lessons || 0;
                var badgeColor = 'badge-light';
                if (subscription === 0) badgeColor = 'badge-red';
                else if (subscription <= 3) badgeColor = 'badge-yellow';
                else badgeColor = 'badge-green';
                var initials = (student.name || '?').split(' ').map(function(w) { return w[0]; }).join('').substring(0, 2).toUpperCase();
                html += '<div class="student-card" onclick="selectStudentById(\'' + student.id + '\')">';
                html += '<div class="student-info">';
                html += '<div class="student-avatar">' + initials + '</div>';

                html += '<div class="student-name">' + (student.name || 'Без имени') + '</div>';
                html += '<div class="student-details">🎫 ' + subscription + ' занятий · ' + ((student.schedule && student.schedule.length) || 0) + ' дней</div>';
                html += '</div>';
                html += '</div>';
                html += '<div class="student-badges">';
                html += '<span class="badge ' + badgeColor + '">' + subscription + '</span>';
                html += '<span class="badge badge-light">' + (student.reminders_on ? '🔔' : '🔕') + '</span>';
                html += '<button class="btn btn-danger btn-small" onclick="event.stopPropagation();deleteStudent(\'' + student.id + '\')">✕</button>';
                html += '</div>';
                html += '</div>';
            }
            return html;
        }

        // ===== ГЛАВНАЯ СТРАНИЦА =====
        function renderHome() {
            var today = new Date();
            var dayOfWeek = DAY_NAMES_FULL[today.getDay()].toUpperCase();
            var day = today.getDate();
            var month = MONTH_NAMES[today.getMonth()].toUpperCase();
            var year = today.getFullYear();
            var dateStr = dayOfWeek + ' · ' + day + ' ' + month + ' ' + year;

            var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            var todayLessons = [];
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                var schedule = student.schedule || [];
                var lessons = generateLessons(schedule, 4);
                var statuses = student.lesson_statuses || {};
                for (var l = 0; l < lessons.length; l++) {
                    var lesson = lessons[l];
                    if (lesson.date === todayStr) {
                        var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                        if (status === LESSON_STATUS.SCHEDULED || status === LESSON_STATUS.RESCHEDULED) {
                            todayLessons.push({
                                student: student.name,
                                time: lesson.time,
                                status: status
                            });
                        }
                    }
                }
            }
            todayLessons.sort(function(a, b) { return a.time.localeCompare(b.time); });

            var doneLessons = 0;
            for (var s2 = 0; s2 < students.length; s2++) {
                var student2 = students[s2];
                var statuses2 = student2.lesson_statuses || {};
                for (var key in statuses2) {
                    if (statuses2[key] === LESSON_STATUS.DONE) {
                        doneLessons++;
                    }
                }
            }
            var PRICE_PER_LESSON = 1000;
            var monthlyIncome = doneLessons * PRICE_PER_LESSON;

            var diary = JSON.parse(localStorage.getItem('diary_entries') || '[]');
            var diaryItems = [];
            for (var d = 0; d < diary.length; d++) {
                diaryItems.push({ text: diary[d].text, time: diary[d].time, status: 'done', dot: 'red' });
            }
            for (var t = 0; t < todayLessons.length; t++) {
                diaryItems.push({
                    text: todayLessons[t].student,
                    time: todayLessons[t].time,
                    status: 'upcoming',
                    dot: 'green'
                });
            }
            diaryItems.sort(function(a, b) { return a.time.localeCompare(b.time); });

            var html = '';

            html += '<div class="date-header">' + dateStr + ' · ' + today.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '</div>';

            html += '<div class="free-day-card">';
            html += '<div class="free-day-top">';
            if (todayLessons.length === 0) {
                html += '<div class="free-day-title">Свободный день</div>';
                html += '<div class="free-day-badge">сегодня</div>';
            } else {
                html += '<div class="free-day-title busy">' + todayLessons.length + ' ' + getLessonsWord(todayLessons.length) + '</div>';
                html += '<div class="free-day-badge">сегодня</div>';
            }
            html += '</div>';
            if (todayLessons.length === 0) {
                html += '<div class="free-day-subtitle">Запланированных уроков нет — можно отдохнуть.</div>';
            } else {
                var list = '';
                for (var tl = 0; tl < todayLessons.length; tl++) {
                    list += todayLessons[tl].student + ' в ' + todayLessons[tl].time;
                    if (tl < todayLessons.length - 1) list += ' · ';
                }
                html += '<div class="free-day-subtitle">' + list + '</div>';
            }
            html += '</div>';

            html += '<div class="income-card">';
            html += '<div class="income-card-top">';
            html += '<div class="income-card-label">Доход · ' + MONTH_NAMES_NOM[today.getMonth()] + '</div>';
            html += '<a class="income-card-link" onclick="alert(\'Подробная статистика в разработке\')">Подробнее →</a>';
            html += '</div>';
            html += '<div class="income-card-amount">' + monthlyIncome.toLocaleString('ru-RU') + '<span class="currency"> ₽</span></div>';
            html += '</div>';

            html += '<div class="two-columns">';

            html += '<div class="mini-card">';
            html += '<div class="mini-card-header">';
            html += '<div class="mini-card-title">ЗАПИСИ НА<br>ЗАНЯТИЯ</div>';

                html += '<div class="mini-card-empty">Заявок нет</div>';

                html += '<div class="mini-card-empty">' + students.length + ' ' + getStudentsWord(students.length) + '</div>';

            html += '<div class="mini-card-header">';
            html += '<div class="mini-card-title">ЕЖЕДНЕВНИК</div>';

                html += '<div class="mini-card-empty">Записей нет</div>';

                html += '<div class="diary-list">';
                for (var di = 0; di < Math.min(diaryItems.length, 5); di++) {
                    var item = diaryItems[di];
                    html += '<div class="diary-item">';
                    html += '<span class="diary-dot ' + item.dot + '"></span>';
                    html += '<span class="diary-text">' + item.text + '</span>';
                    html += '<span class="diary-status ' + (item.status === 'done' ? 'done' : 'upcoming') + '">' + (item.status === 'done' ? 'просрочено' : item.time) + '</span>';
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';

            html += '</div>';

            return html;
        }

        function getLessonsWord(n) {
            if (n % 10 === 1 && n % 100 !== 11) return 'урок';
            if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'урока';
            return 'уроков';
        }
        function getStudentsWord(n) {
            if (n % 10 === 1 && n % 100 !== 11) return 'ученик';
            if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'ученика';
            return 'учеников';
        }

        function updateUI() {
            var content = document.getElementById('appContent');
            if (currentTab === 'home') {
                content.innerHTML = renderHome();
            } else if (currentTab === 'students') {
                content.innerHTML = renderStudents();
            } else if (currentTab === 'schedule') {
                content.innerHTML = renderSchedule();

                content.innerHTML = renderSettings();
            }
            document.getElementById('headerBadge').textContent = '📚 ' + (students ? students.length : 0);
            var navs = ['navHome', 'navStudents', 'navSchedule', 'navSettings'];
            var tabs = ['home', 'students', 'schedule', 'settings'];
            for (var i = 0; i < navs.length; i++) {
                var el = document.getElementById(navs[i]);
                if (el) {
                    el.className = 'nav-item' + (currentTab === tabs[i] ? ' active' : '');
                }
            }
            if (selectedStudent) {
                renderStudentModal();
            }
        }
        function switchTab(tab) {
            currentTab = tab;
            updateUI();
        }

        // ============================================================
        // 15. АВТО-НАПОМИНАНИЯ
        // ============================================================
        var sentNotifications = {};
        function checkUpcomingLessons() {
            var now = new Date();
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                var schedule = student.schedule || [];
                var statuses = student.lesson_statuses || {};
                var lessons = generateLessons(schedule, 1);
                for (var l = 0; l < lessons.length; l++) {
                    var lesson = lessons[l];
                    var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                    if (status !== LESSON_STATUS.SCHEDULED) continue;
                    var lessonDate = lessonToDate(lesson);
                    var diffMinutes = Math.floor((lessonDate.getTime() - now.getTime()) / (1000 * 60));
                    if (diffMinutes >= 58 && diffMinutes <= 62) {
                        var key = student.id + '_' + lesson.id;
                        if (!sentNotifications[key]) {
                            sentNotifications[key] = true;
                            if (student.vk_user_id) {
                                var msg = '🔔 Напоминаем, что через 60 минут начнется занятие по русскому языку в ' + lesson.time + ' (' + formatDate(lesson.date) + ')';
                                sendVkMessage(student.vk_user_id, msg);
                            }
                            sendVkMessage(TUTOR_VK_ID, '🔔 Напоминание: занятие с ' + student.name + ' в ' + lesson.time);
                        }
                    }
                }
            }
        }
        var autoReminderInterval = null;
        function startAutoReminders() {
            if (autoReminderInterval) clearInterval(autoReminderInterval);
            setTimeout(function() { checkUpcomingLessons(); }, 5000);
            autoReminderInterval = setInterval(function() { checkUpcomingLessons(); }, 60000);
        }

        // ============================================================
        // 16. ЗАПУСК
        // ============================================================
        loadStudents().then(function() {
            startAutoReminders();
            updateUI();
        });
    </script>

</body>
