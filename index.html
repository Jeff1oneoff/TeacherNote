<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Репетитор</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            --bg: #0b1610;
            --bg-2: #0e1a12;
            --card: #14231a;
            --card-2: #182a20;
            --card-hover: #1c3225;
            --border: #23392a;
            --border-soft: #1c2c21;
            --text: #e8f0e5;
            --text-dim: #a8bfa8;
            --text-mute: #6f8a75;
            --accent: #c5e0a4;
            --accent-2: #a8c98a;
            --accent-dark: #7fbf87;
            --green: #7fbf87;
            --green-dark: #4a7c59;
            --red: #e07a5f;
            --orange: #e0b25f;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(127, 191, 135, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(197, 224, 164, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            max-width: 430px;
            margin: 0 auto;
            padding: 0 0 110px 0;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ HEADER ============ */
        .header {
            padding: 22px 20px 14px 20px;
            background: linear-gradient(180deg, rgba(11, 22, 16, 0.95) 0%, rgba(11, 22, 16, 0.85) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-soft);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .header-title span {
            color: var(--accent);
            font-style: italic;
        }
        .header-badge {
            background: var(--card);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .header-subtitle {
            font-size: 13px;
            color: var(--text-mute);
            margin-top: 4px;
            letter-spacing: 0.2px;
        }
        .auto-status {
            font-size: 11px;
            color: var(--accent);
            padding: 6px 14px;
            background: rgba(127, 191, 135, 0.1);
            border: 1px solid rgba(127, 191, 135, 0.2);
            border-radius: 20px;
            text-align: center;
            display: inline-block;
            margin: 4px auto;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* ============ CARDS ============ */
        .card {
            background: linear-gradient(145deg, var(--card) 0%, var(--card-2) 100%);
            border-radius: 24px;
            padding: 18px;
            margin: 12px 16px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-soft);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.2px;
        }

        /* ============ BUTTONS ============ */
        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            margin-top: 8px;
            letter-spacing: 0.2px;
            font-family: inherit;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn-primary {
            background: var(--accent);
            color: #0b1610;
            font-weight: 700;
        }
        .btn-success {
            background: rgba(127, 191, 135, 0.15);
            color: var(--accent);
            border: 1px solid rgba(127, 191, 135, 0.3);
        }
        .btn-danger {
            background: rgba(224, 122, 95, 0.15);
            color: var(--red);
            border: 1px solid rgba(224, 122, 95, 0.3);
        }
        .btn-warning {
            background: rgba(224, 178, 95, 0.15);
            color: var(--orange);
            border: 1px solid rgba(224, 178, 95, 0.3);
        }
        .btn-secondary {
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-small {
            padding: 7px 14px;
            font-size: 12px;
            width: auto;
            margin: 4px;
            border-radius: 10px;
        }

        /* ============ INPUTS ============ */
        .input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            margin-bottom: 10px;
            background: var(--card-2);
            color: var(--text);
            transition: all 0.2s;
            font-family: inherit;
        }
        .input:focus {
            outline: none;
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 3px rgba(127, 191, 135, 0.15);
            background: var(--card-hover);
        }
        .input::placeholder { color: var(--text-mute); }

        .textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            margin-bottom: 10px;
            background: var(--card-2);
            color: var(--text);
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }
        .textarea:focus {
            outline: none;
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 3px rgba(127, 191, 135, 0.15);
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .text-muted { color: var(--text-mute); font-size: 13px; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .mt-8 { margin-top: 8px; }

        /* ============ STUDENT LIST CARD ============ */
        .student-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px;
            margin-bottom: 10px;
            background: linear-gradient(145deg, var(--card) 0%, var(--card-2) 100%);
            border-radius: 20px;
            border: 1px solid var(--border-soft);
            cursor: pointer;
            transition: all 0.25s;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .student-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(197, 224, 164, 0.15), transparent);
        }
        .student-card:hover {
            background: linear-gradient(145deg, var(--card-2) 0%, var(--card-hover) 100%);
            box-shadow: var(--shadow-soft);
            transform: translateY(-1px);
        }
        .student-card.archived { opacity: 0.5; }
        .student-left {
            display: flex;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .student-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(197, 224, 164, 0.15) 0%, rgba(127, 191, 135, 0.08) 100%);
            border: 1px solid rgba(197, 224, 164, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        .student-info { flex: 1; min-width: 0; }
        .student-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: 0.2px;
        }
        .student-meta {
            font-size: 12px;
            color: var(--text-mute);
            margin-bottom: 2px;
            line-height: 1.5;
        }
        .student-next {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }
        .student-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
        }
        .lessons-count {
            background: rgba(127, 191, 135, 0.12);
            color: var(--accent);
            border: 1px solid rgba(127, 191, 135, 0.2);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .lessons-count.warning {
            background: rgba(224, 178, 95, 0.12);
            color: var(--orange);
            border-color: rgba(224, 178, 95, 0.25);
        }
        .lessons-count.danger {
            background: rgba(224, 122, 95, 0.12);
            color: var(--red);
            border-color: rgba(224, 122, 95, 0.25);
        }
        .student-dots {
            color: var(--text-mute);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 10px;
            transition: all 0.2s;
            user-select: none;
        }
        .student-dots:hover {
            background: var(--card-hover);
            color: var(--accent);
        }
        .student-pay-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--red);
            background: rgba(224, 122, 95, 0.12);
            border: 1px solid rgba(224, 122, 95, 0.25);
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
        .archive-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-mute);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        /* ============ CONTEXT MENU ============ */
        .context-menu-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .context-menu-overlay.hidden { display: none !important; }
        .context-menu {
            background: linear-gradient(145deg, var(--card) 0%, var(--card-2) 100%);
            border-radius: 24px;
            padding: 8px;
            min-width: 260px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            animation: popIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .context-menu-header {
            padding: 14px 16px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 4px;
            text-align: center;
        }
        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            transition: all 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .context-menu-item:hover { background: var(--card-hover); }
        .context-menu-item.danger { color: var(--red); }
        .context-menu-item.danger:hover { background: rgba(224, 122, 95, 0.1); }
        .context-menu-item .menu-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .context-menu-cancel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            margin-top: 4px;
            border-top: 1px solid var(--border-soft);
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dim);
            background: none;
            border: none;
            width: 100%;
            transition: all 0.15s;
            font-family: inherit;
        }
        .context-menu-cancel:hover { background: var(--card-hover); }

        /* ============ CALENDAR ============ */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-mute);
            padding: 6px 0;
            letter-spacing: 0.5px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--card-2);
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            transition: all 0.2s;
            position: relative;
            min-height: 42px;
            cursor: default;
            border: 1px solid transparent;
        }
        .calendar-day.empty { background: transparent; border: none; }
        .calendar-day.has-lessons {
            background: linear-gradient(145deg, var(--accent) 0%, var(--accent-2) 100%);
            color: #0b1610;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(197, 224, 164, 0.2);
        }
        .calendar-day.has-lessons:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(197, 224, 164, 0.35);
        }
        .calendar-day.has-note { border: 1.5px solid var(--orange); }
        .calendar-day.today { border: 1.5px solid var(--accent); }
        .calendar-day .day-number { font-size: 14px; font-weight: 600; }
        .calendar-day .lesson-count {
            font-size: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 0 6px;
            margin-top: 1px;
        }
        .calendar-day .note-indicator {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
        }
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-nav button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 16px;
            border-radius: 12px;
            color: var(--accent);
            font-weight: 500;
            transition: all 0.2s;
        }
        .calendar-nav button:hover { background: var(--card-hover); }
        .calendar-nav .month-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .calendar-legend {
            display: flex;
            gap: 14px;
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-mute);
            justify-content: center;
            flex-wrap: wrap;
        }
        .calendar-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .calendar-legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
            background: var(--accent);
        }
        .calendar-legend-dot.today-dot { border: 1.5px solid var(--accent); background: transparent; }
        .calendar-legend-dot.note-dot { background: var(--orange); }

        /* ============ MODALS ============ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .modal-overlay.hidden { display: none !important; }
        .modal-content {
            background: linear-gradient(145deg, var(--card) 0%, var(--card-2) 100%);
            border-radius: 26px;
            padding: 26px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
        }
        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: center;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .modal-btn {
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .modal-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .modal-btn-done { background: rgba(127, 191, 135, 0.15); color: var(--green); border: 1px solid rgba(127, 191, 135, 0.3); }
        .modal-btn-reschedule { background: rgba(224, 178, 95, 0.15); color: var(--orange); border: 1px solid rgba(224, 178, 95, 0.3); }
        .modal-btn-cancel { background: rgba(224, 122, 95, 0.15); color: var(--red); border: 1px solid rgba(224, 122, 95, 0.3); }
        .modal-btn-close { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
        .modal-btn-scheduled { background: var(--accent); color: #0b1610; }

        #statusModal { z-index: 2000; }
        #weeklyDayModal { z-index: 2000; }
        #debtsModal { z-index: 2000; }
        #renewModal { z-index: 2000; }
        #statsModal { z-index: 2000; }

        /* ============ BOTTOM NAV ============ */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 410px;
            width: calc(100% - 24px);
            background: rgba(20, 35, 26, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 4px;
            z-index: 100;
            border: 1px solid var(--border);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 6px;
            color: var(--text-mute);
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s;
            position: relative;
            flex: 1;
            border-radius: 16px;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .nav-item .nav-icon { font-size: 20px; line-height: 1; opacity: 0.7; transition: all 0.2s; }
        .nav-item.active { color: var(--accent); }
        .nav-item.active .nav-icon { transform: scale(1.1); opacity: 1; }
        .nav-plus {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent) 0%, var(--accent-2) 100%);
            color: #0b1610;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(197, 224, 164, 0.35);
            transition: all 0.2s;
            flex-shrink: 0;
            margin: 0 4px;
        }
        .nav-plus:hover { transform: scale(1.06); box-shadow: 0 8px 24px rgba(197, 224, 164, 0.5); }
        .nav-plus:active { transform: scale(0.95); }

        .hidden { display: none !important; }

        /* ============ LESSON ITEM ============ */
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-soft);
            cursor: pointer;
            flex-wrap: wrap;
            gap: 4px;
        }
        .lesson-item:hover {
            background: var(--card-hover);
            margin: 0 -8px;
            padding: 12px 8px;
            border-radius: 10px;
        }
        .lesson-item:last-child { border-bottom: none; }
        .lesson-date {
            font-size: 14px;
            color: var(--text);
            flex: 1;
            min-width: 120px;
        }
        .lesson-status-done { color: var(--green); text-decoration: line-through; opacity: 0.7; }
        .lesson-status-canceled { color: var(--red); text-decoration: line-through; opacity: 0.7; }
        .lesson-status-rescheduled { color: var(--orange); }

        .day-chip-active {
            background: rgba(197, 224, 164, 0.12);
            color: var(--accent);
            border: 1px solid rgba(197, 224, 164, 0.25);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: default;
            display: inline-block;
            margin: 3px;
            font-weight: 500;
        }
        .day-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

        .week-info {
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
            padding: 10px;
            background: var(--card-2);
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-soft);
            letter-spacing: 0.3px;
        }

        function formatDate(dateString) {
            var parts = dateString.split('-');
            return parts[2] + '-' + parts[1] + '-' + parts[0];
        }
        function getLocalDateStr(date) {
            return date.getFullYear() + '-' + 
                   String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(date.getDate()).padStart(2, '0');
        }
        function lessonToDate(lesson) {

        }
        function getStatusText(status) {
            if (status === LESSON_STATUS.DONE) return 'Проведён';
            if (status === LESSON_STATUS.CANCELED) return 'Отменён';
            if (status === LESSON_STATUS.RESCHEDULED) return 'Перенесён';
            return 'Запланирован';
        }
        function getMondayBasedDay(date) {
            var day = date.getDay();
            return day === 0 ? 6 : day - 1;
        }
        function getDurationText(min) {
            if (min === 60) return '1 час';
            if (min === 90) return '1,5 часа';
            if (min === 120) return '2 часа';
            return min + ' мин';
        }
        function getDurationShort(min) {
            if (min === 60) return '60 мин';
            if (min === 90) return '90 мин';
            if (min === 120) return '120 мин';
            return min + ' мин';
        }
        function getStudentPrice(student) {
            if (student.lesson_price !== undefined && student.lesson_price !== null) {
                return student.lesson_price;
            }
            return DEFAULT_PRICE;
        }
        function getSubscriptionSize(student) {
            if (student.subscription_size !== undefined && student.subscription_size !== null) {
                return student.subscription_size;
            }
            return DEFAULT_SUBSCRIPTION_SIZE;
        }
        function getPaidLessons(student) {
            if (student.paid_lessons !== undefined && student.paid_lessons !== null) {
                return student.paid_lessons;
            }
            return 0;
        }
        function getDoneCount(student) {
            if (student.done_count !== undefined && student.done_count !== null) {
                return student.done_count;
            }
            var statuses = student.lesson_statuses || {};
            var doneCount = 0;
            for (var key in statuses) {
                if (statuses[key] === LESSON_STATUS.DONE) doneCount++;
            }
            return doneCount;
        }
        function isArchived(student) {
            return student.archived === true;
        }
        function getPhantomSchedule(student) {
            if (student.phantom_schedule === false) return false;
            return true;
        }
        function getNotesForStudent(student) {
            return student.notes_for_student || '';
        }
        function getNotesForSelf(student) {
            return student.notes_for_self || '';
        }
        function getStudentDebt(student) {
            var doneCount = getDoneCount(student);
            var paidLessons = getPaidLessons(student);
            var price = getStudentPrice(student);
            var subSize = getSubscriptionSize(student);
            
            if (doneCount > paidLessons) {
                var unpaidLessons = doneCount - paidLessons;
                var subscriptionsToPay = Math.ceil(unpaidLessons / subSize);
                return {
                    debtLessons: unpaidLessons,
                    subscriptionsToPay: subscriptionsToPay,
                    debtSum: unpaidLessons * price,
                    subSize: subSize,
                    price: price,
                    doneCount: doneCount,
                    paidLessons: paidLessons
                };
            }
            return null;
        }
        function normalizeSchedule(schedule) {
            if (!schedule) return [];
            var result = [];
            for (var i = 0; i < schedule.length; i++) {
                var item = schedule[i];
                var times = item.times || [];
                var newTimes = [];
                for (var t = 0; t < times.length; t++) {
                    var timeItem = times[t];
                    if (typeof timeItem === 'string') {
                        newTimes.push({ time: timeItem, duration: 60 });
                    } else if (timeItem && timeItem.time) {
                        newTimes.push({ 
                            time: timeItem.time, 
                            duration: timeItem.duration || 60 
                        });
                    }
                }
                result.push({ day: item.day, times: newTimes });
            }
            return result;
        }
        function makeLessonId(dateStr, day, time) {
            var cleanTime = time.replace(':', '');
            return dateStr + '-' + day + '-' + cleanTime;
        }
        function generateLessons(schedule, weeksAhead) {
            var lessons = [];
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var currentDay = today.getDay();
            var diffToMonday = currentDay === 0 ? 6 : currentDay - 1;
            var monday = new Date(today);
            monday.setDate(today.getDate() - diffToMonday);
            monday.setHours(0, 0, 0, 0);
            var totalDays = 7 * weeksAhead;
            var normalized = normalizeSchedule(schedule);
            for (var i = 0; i < totalDays; i++) {
                var d = new Date(monday);
                d.setDate(monday.getDate() + i);
                var dayOfWeek = getMondayBasedDay(d);
                var match = null;
                for (var j = 0; j < normalized.length; j++) {
                    if (normalized[j].day === dayOfWeek) { match = normalized[j]; break; }
                }
                if (!match) continue;
                var dateStr = getLocalDateStr(d);
                var times = match.times || [];
                for (var c = 0; c < times.length; c++) {
                    var timeItem = times[c];
                    var timeStr = typeof timeItem === 'string' ? timeItem : timeItem.time;
                    var duration = typeof timeItem === 'string' ? 60 : (timeItem.duration || 60);
                    var lessonDate = new Date(dateStr + 'T' + timeStr + ':00');
                    if (lessonDate.getTime() >= today.getTime() - 24 * 60 * 60 * 1000) {
                        lessons.push({
                            id: makeLessonId(dateStr, match.day, timeStr),
                            date: dateStr,
                            time: timeStr,
                            duration: duration
                        });
                    }
                }
            }
            lessons.sort(function(a, b) {
                if (a.date === b.date) return a.time.localeCompare(b.time);
                return a.date.localeCompare(b.date);
            });
            return lessons;
        }

        function calculateIncome() {
            var totalMoney = 0;
            var paidLessonsTotal = 0;
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                if (isArchived(student)) continue;
                var price = getStudentPrice(student);
                var paidLessons = getPaidLessons(student);
                totalMoney += paidLessons * price;
                paidLessonsTotal += paidLessons;
            }
            return { totalMoney: totalMoney, paidLessonsTotal: paidLessonsTotal };
        }

        function generateAllLessonsForIncome(schedule) {
            var lessons = [];
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var currentDay = today.getDay();
            var diffToMonday = currentDay === 0 ? 6 : currentDay - 1;
            var monday = new Date(today);
            monday.setDate(today.getDate() - diffToMonday);
            monday.setHours(0, 0, 0, 0);
            var totalDays = 7 * 8;
            var startOffset = -7 * 4;
            var normalized = normalizeSchedule(schedule);
            for (var i = 0; i < totalDays; i++) {
                var d = new Date(monday);
                d.setDate(monday.getDate() + startOffset + i);
                var dayOfWeek = getMondayBasedDay(d);
                var match = null;
                for (var j = 0; j < normalized.length; j++) {
                    if (normalized[j].day === dayOfWeek) { match = normalized[j]; break; }
                }
                if (!match) continue;
                var dateStr = getLocalDateStr(d);
                var times = match.times || [];
                for (var c = 0; c < times.length; c++) {
                    var timeItem = times[c];
                    var timeStr = typeof timeItem === 'string' ? timeItem : timeItem.time;
                    var duration = typeof timeItem === 'string' ? 60 : (timeItem.duration || 60);

                        id: makeLessonId(dateStr, match.day, timeStr),
                        date: dateStr,
                        time: timeStr,
                        duration: duration
                    });
                }
            }

        function calculateWeeklyLoad() {
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var todayStr = getLocalDateStr(today);
            var currentDay = today.getDay();
            var diffToMonday = currentDay === 0 ? 6 : currentDay - 1;
            var monday = new Date(today);
            monday.setDate(today.getDate() - diffToMonday + weeklyLoadWeekOffset * 7);
            monday.setHours(0, 0, 0, 0);
            
            var days = [];
            var totalLessons = 0;
            for (var i = 0; i < 7; i++) {
                var d = new Date(monday);
                d.setDate(monday.getDate() + i);
                var dateStr = getLocalDateStr(d);
                var dayLessons = 0;
                var lessonsList = [];
                
                for (var s = 0; s < students.length; s++) {
                    var student = students[s];
                    if (isArchived(student)) continue;
                    var schedule = student.schedule || [];
                    var statuses = student.lesson_statuses || {};
                    var price = getStudentPrice(student);
                    var lessons = generateAllLessonsForIncome(schedule);
                    for (var l = 0; l < lessons.length; l++) {
                        var lesson = lessons[l];
                        if (lesson.date === dateStr) {
                            var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                            if (status === LESSON_STATUS.SCHEDULED || status === LESSON_STATUS.RESCHEDULED || status === LESSON_STATUS.DONE) {
                                dayLessons++;
                                lessonsList.push({
                                    studentName: student.name,
                                    time: lesson.time,
                                    duration: lesson.duration,
                                    price: price,
                                    status: status
                                });
                            }
                        }
                    }
                }
                
                lessonsList.sort(function(a, b) { return a.time.localeCompare(b.time); });
                
                days.push({
                    dayNum: i, dayName: DAY_NAMES[i], date: d.getDate(),
                    dateStr: dateStr, count: dayLessons,
                    isToday: dateStr === todayStr, lessons: lessonsList
                });
                totalLessons += dayLessons;
            }
            return { days: days, total: totalLessons };
        }

        function calculateDebts() {
            var debtors = [];

            for (var s = 0; s < students.length; s++) {

                var debtInfo = getStudentDebt(student);

                        subscriptionsToPay: debtInfo.subscriptionsToPay,
                        subSize: debtInfo.subSize, price: debtInfo.price,
                        doneCount: debtInfo.doneCount, paidLessons: debtInfo.paidLessons
                    });
                    totalDebt += debtInfo.debtSum;
                }
            }
            debtors.sort(function(a, b) { return b.debt - a.debt; });
            return { debtors: debtors, total: totalDebt };
        }

                    var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                    if (status === LESSON_STATUS.DONE) { doneCount++; paidMoney += price; }
                    if (status === LESSON_STATUS.SCHEDULED) { scheduledCount++; unpaidMoney += price; }
                    if (status === LESSON_STATUS.CANCELED) canceledCount++;
                    if (status === LESSON_STATUS.RESCHEDULED) rescheduledCount++;
                }
            }
            var totalPlanned = doneCount + scheduledCount + canceledCount + rescheduledCount;
            var tempo = totalPlanned > 0 ? Math.round(doneCount / totalPlanned * 100) : 0;
            
            return { paidPercent: paidPercent, tempo: tempo, canceled: canceledCount,
                doneCount: doneCount, scheduledCount: scheduledCount,
                canceledCount: canceledCount, rescheduledCount: rescheduledCount,
                paidMoney: paidMoney, unpaidMoney: unpaidMoney, totalPlanned: totalPlanned };
        }

        function getNextLesson(student) {
            var allLessons = generateAllLessonsForIncome(student.schedule || []);
            var statuses = student.lesson_statuses || {};
            var now = new Date();
            now.setHours(0, 0, 0, 0);
            var todayStr = getLocalDateStr(now);
            var candidates = [];
            for (var i = 0; i < allLessons.length; i++) {
                var l = allLessons[i];
                var status = statuses[l.id] || LESSON_STATUS.SCHEDULED;
                if (status !== LESSON_STATUS.SCHEDULED) continue;
                if (l.date >= todayStr) candidates.push(l);
            }
            candidates.sort(function(a, b) {
                if (a.date === b.date) return a.time.localeCompare(b.time);
                return a.date.localeCompare(b.date);
            });
            if (candidates.length === 0) return null;
            var next = candidates[0];
            var nextDate = new Date(next.date + 'T00:00:00');
            var today = new Date();
            today.setHours(0,0,0,0);
            var diffDays = Math.round((nextDate - today) / (1000*60*60*24));
            var dayLabel;
            if (diffDays === 0) dayLabel = 'сегодня';
            else if (diffDays === 1) dayLabel = 'завтра';
            else dayLabel = DAY_NAMES[getMondayBasedDay(nextDate)];
            return { lesson: next, date: next.date, time: next.time, duration: next.duration,
                dayLabel: dayLabel, isToday: diffDays === 0, isTomorrow: diffDays === 1 };
        }

        async function confirmAddDay(studentId) {
            if (editAddDay === null || editAddDay < 0) return;
            var student = students.find(function(s) { return s.id === studentId; });
            if (!student) return;
            var schedule = normalizeSchedule(student.schedule || []);
            var existingDayIndex = -1;
            for (var k = 0; k < schedule.length; k++) {
                if (schedule[k].day === editAddDay) { existingDayIndex = k; break; }
            }
            var uniqueTimes = [];
            var seenTimes = {};
            for (var i = 0; i < editAddTimes.length; i++) {
                var item = editAddTimes[i];
                if (!seenTimes[item.time]) { seenTimes[item.time] = true; uniqueTimes.push({ time: item.time, duration: item.duration }); }
            }
            uniqueTimes.sort(function(a, b) { return a.time.localeCompare(b.time); });
            var newSchedule;
            if (existingDayIndex >= 0) {
                var existingTimes = schedule[existingDayIndex].times || [];
                var combinedTimes = existingTimes.concat(uniqueTimes);
                var finalTimes = [];
                var finalSeen = {};
                for (var f = 0; f < combinedTimes.length; f++) {
                    var ft = combinedTimes[f];
                    if (!finalSeen[ft.time]) { finalSeen[ft.time] = true; finalTimes.push(ft); }
                }
                finalTimes.sort(function(a, b) { return a.time.localeCompare(b.time); });
                newSchedule = schedule.slice();
                newSchedule[existingDayIndex] = { day: editAddDay, times: finalTimes };
            } else {
                newSchedule = schedule.concat([{ day: editAddDay, times: uniqueTimes }]);
            }
            try {
                var result = await supabaseClient.from('students').update({ schedule: newSchedule }).eq('id', studentId);
                if (result.error) { alert('Ошибка: ' + result.error.message); return; }
                editAddDay = -1;
                editAddTimes = [{ time: '15:00', duration: 60 }];
                await refreshData();
                alert((existingDayIndex >= 0 ? 'Занятие добавлено!' : 'День добавлен!'));
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

            var student = students.find(function(s) { return s.id === studentId; });

            var statuses = student.lesson_statuses || {};
            var currentStatus = statuses[lessonId] || LESSON_STATUS.SCHEDULED;

            if (newStatus === LESSON_STATUS.SCHEDULED) delete statuses[lessonId];
            else statuses[lessonId] = newStatus;
            
            try {
                var result = await supabaseClient.from('students').update({ 
                    lesson_statuses: statuses, done_count: doneCount
                }).eq('id', studentId);

            var student = selectedStudent;
            var lessons = generateLessons(student.schedule || [], 1);
            var statuses = student.lesson_statuses || {};
            var futureLessons = lessons.filter(function(l) {

            });
            if (futureLessons.length === 0) { alert('Нет запланированных занятий на эту неделю'); return; }
            var count = 0;
            for (var i = 0; i < futureLessons.length; i++) {
                var l = futureLessons[i];

                var reminderDate = new Date(lessonDate.getTime() - 60 * 60 * 1000);

                if (result.error) { alert('Ошибка: ' + result.error.message); return; }

        function fillDiaryDateSelects(date) {
            var daySelect = document.getElementById('diaryDaySelect');
            var monthSelect = document.getElementById('diaryMonthSelect');
            var yearSelect = document.getElementById('diaryYearSelect');
            var i;
            daySelect.innerHTML = '';
            for (i = 1; i <= 31; i++) {
                var opt = document.createElement('option');
                opt.value = i; opt.textContent = i;
                if (i === date.getDate()) opt.selected = true;
                daySelect.appendChild(opt);
            }
            monthSelect.innerHTML = '';
            for (i = 1; i <= 12; i++) {
                var opt2 = document.createElement('option');
                opt2.value = i; opt2.textContent = String(i).padStart(2, '0');
                if (i === date.getMonth() + 1) opt2.selected = true;
                monthSelect.appendChild(opt2);
            }
            yearSelect.innerHTML = '';
            var currentYear = new Date().getFullYear();
            for (i = currentYear; i <= currentYear + 3; i++) {
                var opt3 = document.createElement('option');
                opt3.value = i; opt3.textContent = i;
                if (i === date.getFullYear()) opt3.selected = true;
                yearSelect.appendChild(opt3);
            }
        }

        function getWeekInfo() {
            var today = new Date();
            var currentDay = today.getDay();
            var diff = today.getDate() - (currentDay === 0 ? 6 : currentDay - 1);
            var monday = new Date(today);
            monday.setDate(diff);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            var options = { day: 'numeric', month: 'long' };
            return monday.toLocaleDateString('ru-RU', options) + ' - ' + sunday.toLocaleDateString('ru-RU', options);
        }
        function renderCalendar() {
            var year = calendarDate.getFullYear();
            var month = calendarDate.getMonth();
            var firstDayOfMonth = new Date(year, month, 1);
            var lastDayOfMonth = new Date(year, month + 1, 0);
            var daysInMonth = lastDayOfMonth.getDate();
            var startDayOfWeek = getMondayBasedDay(firstDayOfMonth);
            var allLessons = {};
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                if (isArchived(student)) continue;
                var schedule = student.schedule || [];
                var lessons = generateLessons(schedule, 4);
                var statuses = student.lesson_statuses || {};
                for (var l = 0; l < lessons.length; l++) {
                    var lesson = lessons[l];
                    var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                    if (status === LESSON_STATUS.SCHEDULED || status === LESSON_STATUS.RESCHEDULED) {
                        if (!allLessons[lesson.date]) allLessons[lesson.date] = [];
                        allLessons[lesson.date].push({
                            student: student.name, time: lesson.time,
                            duration: lesson.duration, status: status
                        });
                    }
                }
            }
            for (var dateKey in allLessons) {
                allLessons[dateKey].sort(function(a, b) { return a.time.localeCompare(b.time); });
            }
            var notes = JSON.parse(localStorage.getItem('calendar_notes') || '{}');
            var today = new Date();
            var todayStr = getLocalDateStr(today);
            var html = '<div class="card">';
            html += '<div class="calendar-nav">';
            html += '<button onclick="changeMonth(-1)">‹</button>';
            html += '<span class="month-label">' + MONTH_NAMES_NOM[month] + ' ' + year + '</span>';
            html += '<button onclick="changeMonth(1)">›</button>';
            html += '</div>';
            html += '<div class="calendar-grid">';
            for (var d = 0; d < 7; d++) html += '<div class="calendar-day-header">' + DAY_NAMES[d] + '</div>';
            for (var i = 0; i < startDayOfWeek; i++) html += '<div class="calendar-day empty"></div>';
            for (var day = 1; day <= daysInMonth; day++) {
                var dateObj = new Date(year, month, day);
                var dateStr = getLocalDateStr(dateObj);
                var isToday = dateStr === todayStr;
                var hasLessons = allLessons[dateStr] && allLessons[dateStr].length > 0;
                var lessonCount = hasLessons ? allLessons[dateStr].length : 0;
                var lessonInfo = hasLessons ? allLessons[dateStr] : [];
                var hasNote = notes[dateStr] && notes[dateStr].trim() !== '';
                var classes = 'calendar-day';
                if (hasLessons) classes += ' has-lessons';
                if (hasNote) classes += ' has-note';
                if (isToday) classes += ' today';
                html += '<div class="' + classes + '" onclick="openDayModal(\'' + dateStr + '\', ' + JSON.stringify(lessonInfo).replace(/"/g, '&quot;') + ')">';
                html += '<span class="day-number">' + day + '</span>';
                if (hasLessons) html += '<span class="lesson-count">' + lessonCount + '</span>';
                if (hasNote) html += '<span class="note-indicator">📝</span>';
                html += '</div>';
            }
            html += '</div>';
            html += '<div class="calendar-legend">';
            html += '<span class="calendar-legend-item"><span class="calendar-legend-dot"></span> Занятия</span>';
            html += '<span class="calendar-legend-item"><span class="calendar-legend-dot today-dot"></span> Сегодня</span>';
            html += '<span class="calendar-legend-item"><span class="calendar-legend-dot note-dot"></span> Заметка</span>';
            html += '</div>';
            html += '</div>';
            return html;
        }

        function renderHome() {
            var today = new Date();
            var dayOfWeek = DAY_NAMES_FULL[today.getDay()].toUpperCase();
            var day = today.getDate();
            var month = MONTH_NAMES[today.getMonth()].toUpperCase();
            var year = today.getFullYear();
            var dateStr = dayOfWeek + ' · ' + day + ' ' + month + ' ' + year;
            var todayStr = getLocalDateStr(today);
            
            var todayLessons = [];
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                if (isArchived(student)) continue;
                var schedule = student.schedule || [];
                var lessons = generateLessons(schedule, 4);
                var statuses = student.lesson_statuses || {};
                for (var l = 0; l < lessons.length; l++) {
                    var lesson = lessons[l];
                    if (lesson.date === todayStr) {
                        var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                        if (status === LESSON_STATUS.SCHEDULED || status === LESSON_STATUS.RESCHEDULED) {
                            todayLessons.push({
                                student: student.name, time: lesson.time,
                                duration: lesson.duration, status: status
                            });
                        }
                    }
                }
            }
            todayLessons.sort(function(a, b) { return a.time.localeCompare(b.time); });

            var incomeData = calculateIncome();
            var monthlyIncome = incomeData.totalMoney;

            var diary = JSON.parse(localStorage.getItem('diary_entries') || '[]');
            var diaryItems = [];
            var todayDateStr = getLocalDateStr(today);
            for (var d = 0; d < diary.length; d++) {
                diaryItems.push({
                    id: diary[d].id, text: diary[d].text, time: diary[d].time,
                    done: diary[d].done || false, date: diary[d].date || todayDateStr
                });
            }
            diaryItems.sort(function(a, b) {
                if (a.date === b.date) return a.time.localeCompare(b.time);
                return a.date.localeCompare(b.date);
            });

            var activeStudentsCount = students.filter(function(s) { return !isArchived(s); }).length;

            var html = '';
            html += '<div class="date-header">' + dateStr + ' · ' + today.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '</div>';

            html += '<div class="free-day-card" onclick="openTodayLessonsModal()">';
            html += '<div class="free-day-top">';
            if (todayLessons.length === 0) {
                html += '<div class="free-day-title">Свободный день</div>';
                html += '<div class="free-day-badge">сегодня</div>';
            } else {
                html += '<div class="free-day-title">' + todayLessons.length + ' ' + getLessonsWord(todayLessons.length) + '</div>';
                html += '<div class="free-day-badge">сегодня</div>';
            }
            html += '</div>';
            if (todayLessons.length === 0) {
                html += '<div class="free-day-subtitle">Запланированных уроков нет — можно отдохнуть.</div>';
            } else {
                var list = '';
                for (var tl = 0; tl < todayLessons.length; tl++) {
                    list += todayLessons[tl].student + ' в ' + todayLessons[tl].time;
                    if (tl < todayLessons.length - 1) list += ' · ';
                }
                html += '<div class="free-day-subtitle">' + list + '</div>';
            }
            html += '</div>';

            html += '<div class="income-card" onclick="openIncomeModal()">';
            html += '<div class="income-card-top">';
            html += '<div class="income-card-label">Доход · ' + MONTH_NAMES_NOM[today.getMonth()] + '</div>';
            html += '<a class="income-card-link">Подробнее →</a>';
            html += '</div>';
            html += '<div class="income-card-amount">' + monthlyIncome.toLocaleString('ru-RU') + '<span class="currency">₽</span></div>';
            html += '</div>';

            html += '<div class="two-columns">';
            html += '<div class="mini-card">';
            html += '<div class="mini-card-header">';
            html += '<div class="mini-card-title">Записи на<br>занятия</div>';
            html += '<button class="mini-card-plus" onclick="openAddStudentModal()">+</button>';
            html += '</div>';
            if (activeStudentsCount === 0) html += '<div class="mini-card-empty">Заявок нет</div>';
            else html += '<div class="mini-card-empty">' + activeStudentsCount + ' ' + getStudentsWord(activeStudentsCount) + '</div>';
            html += '</div>';

            html += '<div class="mini-card">';
            html += '<div class="mini-card-header">';
            html += '<div class="mini-card-title">Ежедневник</div>';
            html += '<button class="mini-card-plus" onclick="openDiaryModal()">+</button>';
            html += '</div>';
            if (diaryItems.length === 0) html += '<div class="mini-card-empty">Записей нет</div>';
            else {
                html += '<div class="diary-list">';
                var maxShowDiary = Math.min(diaryItems.length, 5);
                for (var di = 0; di < maxShowDiary; di++) {
                    var item = diaryItems[di];
                    var dateParts = item.date.split('-');
                    var shortDate = dateParts[2] + '.' + dateParts[1];
                    var isToday = item.date === todayDateStr;
                    var dateLabel = isToday ? 'сегодня' : shortDate;
                    html += '<div class="diary-item">';
                    html += '<button class="diary-checkbox' + (item.done ? ' checked' : '') + '" onclick="toggleDiaryEntry(\'' + item.id + '\')">' + (item.done ? '✓' : '') + '</button>';
                    html += '<span class="diary-text' + (item.done ? ' done' : '') + '">' + item.text + '</span>';
                    html += '<span class="diary-date">' + dateLabel + '</span>';
                    html += '<span class="diary-status">' + item.time + '</span>';
                    html += '<button class="diary-delete" onclick="deleteDiaryEntry(\'' + item.id + '\')">✕</button>';
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            html += '</div>';

            html += renderWeeklyLoad();
            html += renderInfoBlocks();

            return html;
        }

        function getLessonsWord(n) {
            if (n % 10 === 1 && n % 100 !== 11) return 'урок';
            if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'урока';
            return 'уроков';
        }
        function getStudentsWord(n) {
            if (n % 10 === 1 && n % 100 !== 11) return 'ученик';
            if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'ученика';
            return 'учеников';
        }

        function renderStudents() {
            var activeCount = students.filter(function(s) { return !isArchived(s); }).length;
            var archivedCount = students.filter(function(s) { return isArchived(s); }).length;
            var html = '<div class="card">';
            html += '<h3 class="card-title" style="margin-bottom:14px;">Ученики</h3>';
            html += '<div class="students-tabs">';
            html += '<button class="students-tab-btn' + (currentStudentsView === 'active' ? ' active' : '') + '" onclick="switchStudentsView(\'active\')">Активные (' + activeCount + ')</button>';
            html += '<button class="students-tab-btn' + (currentStudentsView === 'archived' ? ' active' : '') + '" onclick="switchStudentsView(\'archived\')">Архив (' + archivedCount + ')</button>';
            html += '</div>';
            html += '<div>' + renderStudentList() + '</div>';
            html += '</div>';
            return html;
        }

        function switchStudentsView(view) {
            currentStudentsView = view;
            updateUI();
        }

        function renderSchedule() { return renderCalendar(); }
        function renderSettings() {
            return '<div class="card">' +
                '<h3 class="card-title" style="margin-bottom:12px;">Настройки</h3>' +
                '<div class="text-muted" style="padding:10px 0;">Здесь будут настройки приложения</div>' +
                '<button class="btn btn-secondary" onclick="alert(\'Функция в разработке\')">Уведомления</button>' +
                '<button class="btn btn-secondary" onclick="alert(\'Функция в разработке\')">О приложении</button>' +
                '</div>';
        }

        function updateUI() {
            var content = document.getElementById('appContent');
            if (currentTab === 'home') content.innerHTML = renderHome();
            else if (currentTab === 'students') content.innerHTML = renderStudents();
            else if (currentTab === 'schedule') content.innerHTML = renderSchedule();
            else if (currentTab === 'settings') content.innerHTML = renderSettings();
            
            document.getElementById('headerBadge').textContent = '📚 ' + (students ? students.filter(function(s){return !isArchived(s);}).length : 0);
            var navs = ['navHome', 'navStudents', 'navSchedule', 'navSettings'];
            var tabs = ['home', 'students', 'schedule', 'settings'];
            for (var i = 0; i < navs.length; i++) {
                var el = document.getElementById(navs[i]);
                if (el) el.className = 'nav-item' + (currentTab === tabs[i] ? ' active' : '');
            }
            if (selectedStudent) renderStudentModal();
        }
        function switchTab(tab) {
            currentTab = tab;
            updateUI();
        }

        var sentNotifications = {};
        function checkUpcomingLessons() {
            var now = new Date();
            for (var s = 0; s < students.length; s++) {
                var student = students[s];
                if (isArchived(student)) continue;
                var schedule = student.schedule || [];
                var statuses = student.lesson_statuses || {};
                var lessons = generateLessons(schedule, 1);
                for (var l = 0; l < lessons.length; l++) {
                    var lesson = lessons[l];
                    var status = statuses[lesson.id] || LESSON_STATUS.SCHEDULED;
                    if (status !== LESSON_STATUS.SCHEDULED) continue;
                    var lessonDate = lessonToDate(lesson);
                    var diffMinutes = Math.floor((lessonDate.getTime() - now.getTime()) / (1000 * 60));
                    if (diffMinutes >= 58 && diffMinutes <= 62) {
                        var key = student.id + '_' + lesson.id;
                        if (!sentNotifications[key]) {
                            sentNotifications[key] = true;
                            if (student.vk_user_id) {
                                var msg = 'Напоминаем, что через 60 минут начнется занятие по русскому языку в ' + lesson.time + ' (' + formatDate(lesson.date) + ')';
                                sendVkMessage(student.vk_user_id, msg);
                            }
                            sendVkMessage(TUTOR_VK_ID, 'Напоминание: занятие с ' + student.name + ' в ' + lesson.time);
                        }
                    }
                }
            }
        }
        var autoReminderInterval = null;
        function startAutoReminders() {
            if (autoReminderInterval) clearInterval(autoReminderInterval);
            setTimeout(function() { checkUpcomingLessons(); }, 5000);
            autoReminderInterval = setInterval(function() { checkUpcomingLessons(); }, 60000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            var btns = document.querySelectorAll('#diaryDateQuickBtns .date-quick-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].addEventListener('click', function() {
                    var offset = parseInt(this.getAttribute('data-offset'));
                    setDiaryDate(offset);
                });
            }
        });

        loadStudents().then(function() {
            startAutoReminders();
            updateUI();
        });
    </script>

</body>
</html>
