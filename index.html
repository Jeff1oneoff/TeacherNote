        var VK_TOKEN = 'vk1.a.SFrwZfMYhMwAiXfkxE3H5H8nWMKRebYlE0smCHC7CVn2O6BWUOfUJ5CnZER8hNHLUaUMnVosmzR6wrg3aM3BPM7OtkLX9S-pHcEhB9k-QSyR9C9VNqKEDTBAM3cYsnqhe6g1f_5lq4INoTHRbKM0jKbXkeUr3htuQOV3hc7LQVwDixV1JXzFFzdbDgITRq55lbwUetxUf2YVH4vNMAWuJQ';

            SCHEDULED: 'scheduled',
            DONE: 'done',
            CANCELED: 'canceled',
            RESCHEDULED: 'rescheduled'
        };

        // ============================================================
        // 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        function formatDate(dateString) {
            var parts = dateString.split('-');
            return parts[2] + '-' + parts[1] + '-' + parts[0];
        }

        function lessonToDate(lesson) {
            return new Date(lesson.date + 'T' + lesson.time + ':00');
        }

        function getStatusText(status) {
            if (status === LESSON_STATUS.DONE) return '✅ Проведен';
            if (status === LESSON_STATUS.CANCELED) return '❌ Отменен';
            if (status === LESSON_STATUS.RESCHEDULED) return '⏳ Перенесен';
            return '📅 Запланирован';
        }

        function generateLessons(schedule, weeksAhead) {
            var lessons = [];
            var today = new Date();
            
            var currentDay = today.getDay();
            var diff = today.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
            var monday = new Date(today);
            monday.setDate(diff);
            monday.setHours(0, 0, 0, 0);
            
            var totalDays = 7 * weeksAhead;

            for (var i = 0; i < totalDays; i++) {
                var d = new Date(monday);
                d.setDate(monday.getDate() + i);
                var dayOfWeek = d.getDay();

                var match = null;
                for (var j = 0; j < schedule.length; j++) {
                    if (schedule[j].day === dayOfWeek) {
                        match = schedule[j];
                        break;
                    }
                }
                if (!match) continue;

                var dateStr = d.toISOString().slice(0, 10);
                var times = match.times || [];

                for (var c = 0; c < times.length; c++) {
                    var timeStr = times[c];
                    var lessonDate = new Date(dateStr + 'T' + timeStr + ':00');
                    
                    if (lessonDate.getTime() >= today.getTime() - 24*60*60*1000) {
                        lessons.push({
                            id: dateStr + '-' + match.day + '-' + c,
                            date: dateStr,
                            time: timeStr
                        });
                    }
                }
            }

            lessons.sort(function(a, b) {
                if (a.date === b.date) {
                    return a.time.localeCompare(b.time);
                }
                return a.date.localeCompare(b.date);
            });
            return lessons;
        }

        // ============================================================
        // ОТПРАВКА СООБЩЕНИЙ В ВК
        // ============================================================
        function sendVkMessage(userId, message) {
            if (!userId) {
                console.warn('⚠️ Нет VK ID для отправки');
                return;
            }

            var userIdNum = parseInt(userId);
            if (isNaN(userIdNum)) {
                console.warn('⚠️ Некорректный VK ID:', userId);
                return;
            }

            fetch('https://api.vk.com/method/messages.send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    user_id: userIdNum,
                    message: message,
                    access_token: VK_TOKEN,
                    v: '5.131',

        // ============================================================
        // 6. КОМПОНЕНТ КАЛЕНДАРЯ
        // ============================================================
        function Calendar(props) {
            var students = props.students;
            var notes = props.notes || {};
            var currentDate = props.currentDate || new Date();
            var onDateClick = props.onDateClick;
            var onMonthChange = props.onMonthChange;

            var year = currentDate.getFullYear();
            var month = currentDate.getMonth();
            var firstDayOfMonth = new Date(year, month, 1);
            var lastDayOfMonth = new Date(year, month + 1, 0);
            var daysInMonth = lastDayOfMonth.getDate();
            var startDayOfWeek = firstDayOfMonth.getDay();

            // Собираем все занятия со всех учеников
            var allLessons = {};
            students.forEach(function(student) {
                var schedule = student.schedule || [];
                var lessons = generateLessons(schedule, 4);
                var statuses = student.lesson_statuses || {};
                
                lessons.forEach(function(l) {
                    var status = statuses[l.id] || LESSON_STATUS.SCHEDULED;
                    if (status === LESSON_STATUS.SCHEDULED || status === LESSON_STATUS.RESCHEDULED) {
                        if (!allLessons[l.date]) {
                            allLessons[l.date] = [];
                        }
                        allLessons[l.date].push({
                            student: student.name,
                            time: l.time,
                            status: status
                        });
                    }
                });
            });

            var changeMonth = function(delta) {
                var newDate = new Date(currentDate);
                newDate.setMonth(newDate.getMonth() + delta);
                onMonthChange(newDate);
            };

            var days = [];
            var today = new Date();
            var todayStr = today.toISOString().slice(0, 10);

            for (var i = 0; i < startDayOfWeek; i++) {
                days.push({ empty: true });
            }

            for (var d = 1; d <= daysInMonth; d++) {
                var dateObj = new Date(year, month, d);
                var dateStr = dateObj.toISOString().slice(0, 10);
                var isToday = dateStr === todayStr;
                var hasLessons = allLessons[dateStr] && allLessons[dateStr].length > 0;
                var lessonCount = hasLessons ? allLessons[dateStr].length : 0;
                var lessonInfo = hasLessons ? allLessons[dateStr] : [];
                var hasNote = notes[dateStr] && notes[dateStr].trim() !== '';

                days.push({
                    day: d,
                    date: dateStr,
                    isToday: isToday,
                    hasLessons: hasLessons,
                    lessonCount: lessonCount,
                    lessonInfo: lessonInfo,
                    hasNote: hasNote
                });
            }

            var monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

            var dayElements = days.map(function(day, index) {
                if (day.empty) {
                    return React.createElement('div', { key: 'empty-' + index, className: 'calendar-day empty' });
                }

                var tooltipContent = null;
                if (day.hasLessons && day.lessonInfo) {
                    var tooltipLines = day.lessonInfo.map(function(info, idx) {
                        return React.createElement('div', { key: idx }, info.student + ' в ' + info.time);
                    });
                    if (day.hasNote) {
                        tooltipLines.push(React.createElement('div', { key: 'note', style: { color: '#ff9500' } }, '📝 Есть заметка'));
                    }
                    tooltipContent = React.createElement(
                        'div',
                        { className: 'calendar-tooltip' },
                        tooltipLines
                    );
                }

                var dayClass = 'calendar-day';
                if (day.hasLessons) dayClass += ' has-lessons';
                if (day.hasNote) dayClass += ' has-note';
                if (day.isToday) dayClass += ' today';

                return React.createElement(
                    'div',
                    {
                        key: day.day,
                        className: dayClass,
                        onClick: function() {
                            onDateClick(day.date, day.lessonInfo, day.hasNote);
                        }
                    },
                    React.createElement('span', { className: 'day-number' }, day.day),
                    day.hasLessons ? 
                        React.createElement('span', { className: 'lesson-count' }, day.lessonCount) : null,
                    day.hasNote ?
                        React.createElement('span', { className: 'note-indicator' }, '📝') : null,
                    tooltipContent
                );
            });

            return React.createElement(
                'div',
                { className: 'card' },
                React.createElement(
                    'div',
                    { className: 'calendar-nav' },
                    React.createElement(
                        'button',
                        { onClick: function() { changeMonth(-1); } },
                        '‹'
                    ),
                    React.createElement(
                        'span',
                        { className: 'month-label' },
                        monthNames[month] + ' ' + year
                    ),
                    React.createElement(
                        'button',
                        { onClick: function() { changeMonth(1); } },
                        '›'
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'calendar-grid' },
                    DAY_NAMES_SHORT.map(function(name) {
                        return React.createElement(
                            'div',
                            { key: name, className: 'calendar-day-header' },
                            name
                        );
                    }),
                    dayElements
                ),
                React.createElement(
                    'div',
                    { className: 'calendar-legend' },
                    React.createElement(
                        'div',
                        { className: 'calendar-legend-item' },
                        React.createElement('span', { className: 'calendar-legend-dot' }),
                        'Занятия'
                    ),
                    React.createElement(
                        'div',
                        { className: 'calendar-legend-item' },
                        React.createElement('span', { className: 'calendar-legend-dot today-dot' }),
                        'Сегодня'
                    ),
                    React.createElement(
                        'div',
                        { className: 'calendar-legend-item' },
                        React.createElement('span', { className: 'calendar-legend-dot note-dot' }),
                        'Заметка'
                    )
                )
            );
        }

                }

            // ===== ДОБАВЛЕНИЕ ДНЯ =====
            async function addDayToSchedule(studentId, day, times) {
                var student = null;
                for (var i = 0; i < students.length; i++) {
                    if (students[i].id === studentId) {
                        student = students[i];
                        break;
                    }
                }
                if (!student) {
                    console.log('❌ Студент не найден!');
                    return;
                }

                var schedule = student.schedule || [];

                var exists = false;
                for (var k = 0; k < schedule.length; k++) {
                    if (schedule[k].day === day) {
                        exists = true;
                        break;
                    }
                }

                if (exists) {
                    alert('⚠️ Этот день уже добавлен!');
                    return;
                }

                var uniqueTimes = times.filter(function(v, i, a) {
                    return a.indexOf(v) === i;
                });
                uniqueTimes.sort();

                var newSchedule = schedule.concat([{
                    day: day,
                    times: uniqueTimes
                }]);

                try {
                    var result = await supabaseClient
                        .from('students')
                        .update({ schedule: newSchedule })
                        .eq('id', studentId);

                    if (result.error) {
                        alert('❌ Ошибка сохранения: ' + result.error.message);
                        return;
                    }

                    await refreshData();
                    setAddDay(null);
                    setAddTimes(['15:00']);
                    alert('✅ День добавлен!');

                } catch (error) {
                    alert('❌ Ошибка: ' + error.message);
                }
            }

            // ===== УДАЛЕНИЕ ДНЯ =====
            async function removeDayFromSchedule(studentId, day) {

                for (var i = 0; i < students.length; i++) {
                    if (students[i].id === studentId) {
                        student = students[i];
                        break;

                    console.log('❌ Студент не найден!');
                    return;
                }

                var schedule = student.schedule || [];

                    return s.day !== day;
                });

                try {

                        .from('students')
                        .update({ schedule: newSchedule })
                        .eq('id', studentId);

                        alert('❌ Ошибка сохранения: ' + result.error.message);

                }
            }

            // ===== ИЗМЕНЕНИЕ СТАТУСА УРОКА (С АБОНЕМЕНТОМ) =====
            async function changeLessonStatus(studentId, lessonId, newStatus) {
                var student = null;
                for (var i = 0; i < students.length; i++) {
                    if (students[i].id === studentId) {
                        student = students[i];
                        break;
                    }
                }
                if (!student) return;

                var statuses = student.lesson_statuses || {};
                var currentStatus = statuses[lessonId] || LESSON_STATUS.SCHEDULED;
                
                // Получаем текущее количество занятий по абонементу
                var subscriptionCount = student.subscription_lessons || 0;
                var subscriptionUpdated = false;
                var needNotify = false;

                // Если отмечаем урок как проведенный И он был запланирован
                if (newStatus === LESSON_STATUS.DONE && currentStatus !== LESSON_STATUS.DONE) {
                    // Уменьшаем количество занятий по абонементу
                    if (subscriptionCount > 0) {
                        subscriptionCount--;
                        subscriptionUpdated = true;
                        
                        // Если после уменьшения стало 0 - нужно уведомить
                        if (subscriptionCount === 0) {
                            needNotify = true;
                        }
                    }
                }

                // Обновляем статус урока
                if (newStatus === LESSON_STATUS.SCHEDULED) {
                    delete statuses[lessonId];
                } else {
                    statuses[lessonId] = newStatus;
                }

                try {
                    // Обновляем статусы и абонемент
                    var updateData = { lesson_statuses: statuses };
                    if (subscriptionUpdated) {
                        updateData.subscription_lessons = subscriptionCount;
                    }

                    var result = await supabaseClient
                        .from('students')
                        .update(updateData)
                        .eq('id', studentId);

                    if (result.error) {
                        alert('Ошибка: ' + result.error.message);
                        return;
                    }

                    await refreshData();

                    // Если абонемент закончился - отправляем уведомление
                    if (needNotify && student.vk_user_id) {
                        var message = '❌ Ваш абонемент на занятия закончился!\n\n' +
                                     'Чтобы продолжить занятия, пожалуйста, оплатите новый абонемент.\n\n' +
                                     'Спасибо! 🙏';
                        sendVkMessage(student.vk_user_id, message);
                        console.log('📨 Отправлено уведомление об окончании абонемента');
                        
                        // Также отправляем себе
                        sendVkMessage(TUTOR_VK_ID, '🔔 Абонемент закончился у ученика ' + student.name);
                    }
                } catch (error) {
                    alert('Ошибка: ' + error.message);
                }
            }

            function openStatusModal(lesson) {
                setModalLesson(lesson);
            }

            // ===== ВКЛЮЧЕНИЕ НАПОМИНАНИЙ =====
            async function enableReminders(student) {
                var lessons = generateLessons(student.schedule || [], 1);
                var statuses = student.lesson_statuses || {};
                var futureLessons = lessons.filter(function(l) {
                    var status = statuses[l.id] || LESSON_STATUS.SCHEDULED;
                    return status === LESSON_STATUS.SCHEDULED;
                });

                if (futureLessons.length === 0) {
                    alert('⚠️ Нет запланированных занятий на эту неделю');
                    return;
                }

                var count = 0;

                for (var i = 0; i < futureLessons.length; i++) {
                    var l = futureLessons[i];
                    var lessonDate = lessonToDate(l);
                    var reminderDate = new Date(lessonDate.getTime() - 60 * 60 * 1000);

                    if (reminderDate.getTime() > Date.now()) {
                        var tutorMessage = '🔔 Напоминание: занятие с ' + student.name + ' в ' + l.time + ' (' + formatDate(l.date) + ')';
                        sendVkMessage(TUTOR_VK_ID, tutorMessage);

                        if (student.vk_user_id) {
                            var studentMessage = 'Напоминаем, что через 60 минут начнется занятие по русскому языку в ' + l.time;
                            sendVkMessage(student.vk_user_id, studentMessage);
                        }

                        count++;
                    }
                }

                try {
                    var result = await supabaseClient
                        .from('students')
                        .update({ reminders_on: true })
                        .eq('id', student.id);

                    if (result.error) {
                        alert('Ошибка сохранения: ' + result.error.message);
                        return;
                    }

                    await refreshData();
                    alert('✅ Запланировано напоминаний: ' + count);
                } catch (error) {
                    alert('Ошибка: ' + error.message);
                }
            }

            // ===== ТЕСТОВАЯ ОТПРАВКА ВК =====
            function testVkMessage(student) {
                if (!student.vk_user_id) {
                    alert('⚠️ У ученика не указан VK ID');
                    return;
                }

                var message = '🧪 Тестовое сообщение от вашего приложения "Репетитор"!\n\n' +
                             'Ученик: ' + student.name + '\n' +
                             'Время: ' + new Date().toLocaleString('ru-RU');

                sendVkMessage(student.vk_user_id, message);
                alert('✅ Сообщение отправлено!');
            }

            // ===== ОБРАБОТЧИК КЛИКА ПО ДНЮ =====
            function handleDateClick(date, lessons, hasNote) {
                var note = calendarNotes[date] || '';
                setDayModal({
                    date: date,
                    lessons: lessons || [],
                    note: note
                });
            }

            function handleSaveNote(date, note) {
                var newNotes = Object.assign({}, calendarNotes);
                if (note.trim() === '') {
                    delete newNotes[date];
                } else {
                    newNotes[date] = note.trim();
                }
                setCalendarNotes(newNotes);
            }

            // ============================================================
            // 8. ОТРИСОВКА
            // ============================================================

            function getWeekInfo() {
                var today = new Date();
                var currentDay = today.getDay();
                var diff = today.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
                var monday = new Date(today);
                monday.setDate(diff);
                
                var sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                
                var options = { day: 'numeric', month: 'long' };
                return '📅 ' + monday.toLocaleDateString('ru-RU', options) + ' - ' + 
                       sunday.toLocaleDateString('ru-RU', options);
            }

            // ===== РЕНДЕР СПИСКА УЧЕНИКОВ С АБОНЕМЕНТОМ =====
            function renderStudentList() {
                if (loading) {
                    return React.createElement('div', { className: 'loading-spinner' }, '⏳ Загрузка...');
                }

                if (students.length === 0) {
                    return React.createElement('div', { className: 'text-muted' }, 'Нет учеников. Добавьте первого!');
                }

                return students.map(function(student) {
                    var statuses = student.lesson_statuses || {};
                    var statusCount = Object.keys(statuses).length;
                    var subscription = student.subscription_lessons || 0;
                    
                    // Определяем цвет бейджа абонемента
                    var badgeClass = 'badge';
                    if (subscription === 0) {
                        badgeClass += ' badge-danger';
                    } else if (subscription <= 3) {
                        badgeClass += ' badge-warning';
                    } else {
                        badgeClass += ' badge-active';
                    }

                    return React.createElement(
                        'div',
                        { key: student.id, className: 'card fade-in' },
                        React.createElement(
                            'div',
                            { className: 'flex-between' },
                            React.createElement(
                                'div',
                                {
                                    className: 'student-name',
                                    onClick: function() { setSelectedStudent(student); }
                                },
                                student.name
                            ),
                            React.createElement(
                                'div',
                                null,
                                React.createElement(
                                    'span',
                                    { className: badgeClass },
                                    '🎫 ' + subscription
                                ),
                                React.createElement(
                                    'span',
                                    { className: 'badge ' + (student.reminders_on ? 'badge-active' : '') },
                                    student.reminders_on ? '🔔' : '🔕'
                                ),
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn btn-danger btn-small',
                                        onClick: function() { deleteStudent(student.id); }
                                    },
                                    '✕'
                                )
                            )
                        ),
                        React.createElement(
                            'div',
                            { className: 'text-muted', style: { fontSize: '13px' } },
                            'Занятий: ' + (student.schedule ? student.schedule.length : 0) + ' дней' +
                            (statusCount > 0 ? ' | Статусов: ' + statusCount : '')
                        )
                    );
                });
            }

            function renderScheduleEditor(student) {
                var schedule = student.schedule || [];
                var allDays = [0, 1, 2, 3, 4, 5, 6];

                var dayList = allDays.map(function(dayNum) {
                    var dayName = DAY_NAMES[dayNum];
                    var scheduleItem = null;
                    for (var k = 0; k < schedule.length; k++) {
                        if (schedule[k].day === dayNum) {
                            scheduleItem = schedule[k];
                            break;
                        }
                    }
                    var isAdded = scheduleItem !== null;

                    return React.createElement(
                        'div',
                        { key: dayNum, className: 'day-schedule-item', style: isAdded ? {} : { opacity: 0.5 } },
                        React.createElement('span', { className: 'day-name' }, dayName),
                        React.createElement(
                            'span',
                            { className: 'day-details' },
                            isAdded ? 
                                React.createElement(
                                    'div',
                                    { className: 'slot-times' },
                                    (scheduleItem.times || []).map(function(t) {
                                        return React.createElement(
                                            'span',
                                            { key: t, className: 'slot-time-tag' },
                                            t
                                        );
                                    })
                                ) :
                                'не добавлен'
                        ),
                        React.createElement(
                            'div',
                            { className: 'day-actions' },
                            isAdded ?
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn-remove-day',
                                        onClick: function() {
                                            if (confirm('Удалить день ' + dayName + '?')) {
                                                removeDayFromSchedule(student.id, dayNum);
                                            }
                                        }
                                    },
                                    '✕'
                                ) :
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn-add-day',
                                        onClick: function() {
                                            setAddDay(dayNum);
                                            setAddTimes(['15:00']);
                                        }
                                    },
                                    '+'
                                )
                        )
                    );
                });

                var addForm = null;
                if (addDay !== null) {
                    var timeOptions = TIME_SLOTS.map(function(t) {
                        return React.createElement(
                            'option',
                            { key: t, value: t },
                            t
                        );
                    });

                    var addTimeSlot = function() {
                        var newTimes = addTimes.concat(['15:00']);
                        setAddTimes(newTimes);
                    };

                    var removeTimeSlot = function(index) {
                        var newTimes = addTimes.filter(function(_, i) { return i !== index; });
                        if (newTimes.length === 0) {
                            newTimes = ['15:00'];
                        }
                        setAddTimes(newTimes);
                    };

                    var changeTimeSlot = function(index, value) {
                        var newTimes = addTimes.map(function(t, i) {
                            return i === index ? value : t;
                        });
                        setAddTimes(newTimes);
                    };

                    var timeSlotItems = addTimes.map(function(time, index) {
                        return React.createElement(
                            'div',
                            { key: index, className: 'time-slot-item' },
                            React.createElement(
                                'select',
                                {
                                    value: time,
                                    onChange: function(e) { changeTimeSlot(index, e.target.value); }
                                },
                                timeOptions
                            ),
                            addTimes.length > 1 ?
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn-remove-slot',
                                        onClick: function() { removeTimeSlot(index); }
                                    },
                                    '✕'
                                ) : null
                        );
                    });

                    addForm = React.createElement(
                        'div',
                        { className: 'count-selector' },
                        React.createElement(
                            'div',
                            { className: 'label' },
                            'Добавление дня: ' + DAY_NAMES[addDay]
                        ),
                        React.createElement(
                            'div',
                            null,
                            React.createElement('span', { className: 'label' }, 'Время занятий:'),
                            React.createElement(
                                'div',
                                { className: 'time-slots' },
                                timeSlotItems
                            ),
                            React.createElement(
                                'button',
                                {
                                    className: 'btn-add-slot',
                                    onClick: addTimeSlot
                                },
                                '+ Добавить время'
                            )
                        ),
                        React.createElement(
                            'button',
                            {
                                className: 'btn',
                                style: { background: '#34c759' },
                                onClick: function() {
                                    if (addTimes.length === 0) {
                                        alert('Добавьте хотя бы одно время!');
                                        return;
                                    }
                                    addDayToSchedule(student.id, addDay, addTimes);
                                }
                            },
                            '✅ Добавить'
                        ),
                        React.createElement(
                            'button',
                            {
                                className: 'btn',
                                style: { background: '#ff3b30' },
                                onClick: function() {
                                    setAddDay(null);
                                    setAddTimes(['15:00']);
                                }
                            },
                            '❌ Отмена'
                        )
                    );
                }

                return React.createElement(
                    'div',
                    null,
                    React.createElement('div', { className: 'label' }, 'Дни недели:'),
                    React.createElement('div', null, dayList),
                    addForm
                );
            }

            function renderScheduleView(student) {
                var schedule = student.schedule || [];
                var hasSchedule = schedule.length > 0;

                if (!hasSchedule) {
                    return React.createElement('div', { className: 'text-muted' }, 'Не настроено');
                }

                var dayItems = schedule.map(function(item) {
                    var times = (item.times || []).join(', ');
                    return React.createElement(
                        'span',
                        { key: item.day, className: 'day-chip-active' },
                        DAY_NAMES[item.day] + ' (' + times + ')'
                    );
                });

                return React.createElement('div', { className: 'day-row' }, dayItems);
            }

            // ===== КОМПОНЕНТ АБОНЕМЕНТА =====
            function SubscriptionEditor(props) {
                var student = props.student;
                var onUpdate = props.onUpdate;

                var subscriptionCount = student.subscription_lessons || 0;
                var isEditing = props.isEditing || false;

                var countClass = 'count good';
                if (subscriptionCount === 0) countClass = 'count danger';
                else if (subscriptionCount <= 3) countClass = 'count warning';

                if (isEditing) {
                    var inputState = React.useState(subscriptionCount);
                    var inputValue = inputState[0];
                    var setInputValue = inputState[1];

                    return React.createElement(
                        'div',
                        { className: 'subscription-box' },
                        React.createElement(
                            'div',
                            null,
                            React.createElement('span', { className: 'label' }, 'Осталось занятий:')
                        ),
                        React.createElement(
                            'div',
                            { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
                            React.createElement('input', {
                                className: 'input-small',
                                type: 'number',
                                min: 0,
                                value: inputValue,
                                onChange: function(e) { setInputValue(parseInt(e.target.value) || 0); }
                            }),
                            React.createElement(
                                'button',
                                {
                                    className: 'btn btn-success btn-small',
                                    onClick: function() { onUpdate(student.id, inputValue); }
                                },
                                '💾 Сохранить'
                            ),
                            React.createElement(
                                'button',
                                {
                                    className: 'btn btn-secondary btn-small',
                                    onClick: function() { onUpdate(student.id, subscriptionCount); }
                                },
                                '↩️ Отмена'
                            )
                        )
                    );
                }

                return React.createElement(
                    'div',
                    { className: 'subscription-box' },
                    React.createElement(
                        'div',
                        null,
                        React.createElement('span', { className: 'label' }, '🎫 Абонемент'),
                        React.createElement(
                            'div',
                            { className: countClass },
                            subscriptionCount + ' занятий'
                        )
                    ),
                    React.createElement(
                        'div',
                        { className: 'subscription-actions' },
                        React.createElement(
                            'button',
                            {
                                className: 'btn btn-warning btn-small',
                                onClick: function() { props.onEditStart(); }
                            },
                            '✏️ Изменить'
                        )
                    )
                );
            }

            function renderStudentCard() {
                if (!selectedStudent) return null;

                var student = selectedStudent;
                var allLessons = generateLessons(student.schedule || [], 1);
                var statuses = student.lesson_statuses || {};

                var lessonsWithStatus = allLessons.map(function(l) {
                    var status = statuses[l.id] || LESSON_STATUS.SCHEDULED;
                    return {
                        id: l.id,
                        date: l.date,
                        time: l.time,
                        status: status
                    };
                });

                var filteredLessons = lessonsWithStatus;
                if (statusFilter !== 'all') {
                    filteredLessons = lessonsWithStatus.filter(function(l) {
                        return l.status === statusFilter;
                    });
                }

                var modal = null;
                if (modalLesson) {
                    var currentStatus = statuses[modalLesson.id] || LESSON_STATUS.SCHEDULED;
                    modal = React.createElement(StatusModal, {
                        lesson: modalLesson,
                        student: student,
                        currentStatus: currentStatus,
                        onClose: function() { setModalLesson(null); },
                        onStatusChange: function(lessonId, newStatus) {
                            changeLessonStatus(student.id, lessonId, newStatus);
                        }
                    });
                }

                var weekInfo = getWeekInfo();

                var lessonItems = filteredLessons.map(function(l) {
                    var statusText = '';
                    var statusClass = '';
                    if (l.status === LESSON_STATUS.DONE) {
                        statusText = '✅';
                        statusClass = 'lesson-status-done';
                    } else if (l.status === LESSON_STATUS.CANCELED) {
                        statusText = '❌';
                        statusClass = 'lesson-status-canceled';
                    } else if (l.status === LESSON_STATUS.RESCHEDULED) {
                        statusText = '⏳';
                        statusClass = 'lesson-status-rescheduled';
                    }

                    return React.createElement(
                        'div',
                        {
                            key: l.id,
                            className: 'lesson-item',
                            onClick: function() {
                                openStatusModal(l);
                            }
                        },
                        React.createElement(
                            'span',
                            { className: 'lesson-date ' + statusClass },
                            formatDate(l.date) + ' в ' + l.time,
                            ' ',
                            statusText
                        ),
                        React.createElement(
                            'span',
                            { className: 'text-muted', style: { fontSize: '12px' } },
                            '👆 Нажмите'
                        )
                    );
                });

                var filterButtons = [
                    { key: 'all', label: 'Все' },
                    { key: LESSON_STATUS.SCHEDULED, label: '📅 Запланированы' },
                    { key: LESSON_STATUS.DONE, label: '✅ Проведены' },
                    { key: LESSON_STATUS.CANCELED, label: '❌ Отменены' },
                    { key: LESSON_STATUS.RESCHEDULED, label: '⏳ Перенесены' }
                ].map(function(filter) {
                    var isActive = statusFilter === filter.key;
                    return React.createElement(
                        'button',
                        {
                            key: filter.key,
                            className: 'btn btn-small ' + (isActive ? 'btn-success' : 'btn-secondary'),
                            onClick: function() { setStatusFilter(filter.key); },
                            style: { margin: '2px' }
                        },
                        filter.label
                    );
                });

                return React.createElement(
                    'div',
                    null,
                    React.createElement(
                        'div',
                        { className: 'card fade-in', style: { marginTop: '16px' } },
                        React.createElement(
                            'div',
                            { className: 'flex-between' },
                            React.createElement('h2', { className: 'subtitle' }, student.name),
                            React.createElement(
                                'div',
                                null,
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn btn-warning btn-small',
                                        onClick: function() { testVkMessage(student); },
                                        style: { marginRight: '4px' }
                                    },
                                    '📨 Тест ВК'
                                ),
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn btn-secondary btn-small',
                                        onClick: function() { setSelectedStudent(null); }
                                    },
                                    '✕ Закрыть'
                                )
                            )
                        ),
                        React.createElement(
                            'div',
                            null,
                            React.createElement('span', { className: 'label' }, 'VK ID:'),
                            React.createElement(
                                'div',
                                { style: { fontSize: '14px', color: '#3a3a3c' } },
                                student.vk_user_id || 'Не указан'
                            )
                        ),
                        // ===== АБОНЕМЕНТ =====
                        React.createElement(SubscriptionEditor, {
                            student: student,
                            isEditing: editSubscription === student.id,
                            onEditStart: function() { setEditSubscription(student.id); },
                            onUpdate: updateSubscription
                        }),
                        React.createElement(
                            'div',
                            { className: 'mt-8' },
                            React.createElement(
                                'div',
                                { className: 'flex-between' },
                                React.createElement('span', { className: 'label' }, 'Расписание:'),
                                React.createElement(
                                    'button',
                                    {
                                        className: 'btn btn-secondary btn-small',
                                        onClick: function() { setEditingSchedule(!editingSchedule); }
                                    },
                                    editingSchedule ? '✅ Готово' : '✏️ Настроить'
                                )
                            ),
                            editingSchedule ? renderScheduleEditor(student) : renderScheduleView(student)
                        ),
                        React.createElement(
                            'button',
                            {
                                className: 'btn ' + (student.reminders_on ? 'btn-success' : ''),
                                onClick: function() { enableReminders(student); }
                            },
                            student.reminders_on ? '✅ Напоминания включены' : '🔔 Включить напоминания'
                        ),
                        React.createElement(
                            'div',
                            { className: 'mt-8' },
                            React.createElement('span', { className: 'label' }, 'Фильтр по статусу:'),
                            React.createElement(
                                'div',
                                { style: { display: 'flex', gap: '4px', flexWrap: 'wrap', marginTop: '4px' } },
                                filterButtons
                            )
                        ),
                        React.createElement(
                            'div',
                            { className: 'mt-8' },
                            React.createElement('div', { className: 'week-info' }, weekInfo),
                            React.createElement('span', { className: 'label' }, 'Занятия на этой неделе:'),
                            filteredLessons.length === 0 ?
                                React.createElement('div', { className: 'text-muted' }, 'Нет занятий на этой неделе') :
                                lessonItems
                        )
                    ),
                    modal
                );
            }

            function renderAddForm() {
                var nameState = React.useState('');
                var name = nameState[0];
                var setName = nameState[1];

                var vkIdState = React.useState('');
                var vkId = vkIdState[0];
                var setVkId = vkIdState[1];

                var handleSubmit = function(e) {
                    e.preventDefault();
                    addStudent(name, vkId || null);
                    setName('');
                    setVkId('');
                };

                return React.createElement(
                    'div',
                    { className: 'card' },
                    React.createElement(
                        'form',
                        { onSubmit: handleSubmit },
                        React.createElement('input', {
                            className: 'input',
                            placeholder: 'Имя ученика',
                            value: name,
                            onChange: function(e) { setName(e.target.value); },
                            required: true
                        }),
                        React.createElement('input', {
                            className: 'input',
                            placeholder: 'VK ID (опционально)',
                            value: vkId,
                            onChange: function(e) { setVkId(e.target.value); }
                        }),
                        React.createElement(
                            'button',
                            { className: 'btn', type: 'submit' },
                            '➕ Добавить ученика'
                        )
                    )
                );
            }

            // Модалка для дня
            var dayModalElement = null;
            if (dayModal) {
                dayModalElement = React.createElement(DayModal, {
                    date: dayModal.date,
                    lessons: dayModal.lessons,
                    note: dayModal.note,
                    onClose: function() { setDayModal(null); },
                    onSaveNote: handleSaveNote
                });
            }

            return React.createElement(
                'div',
                null,
                React.createElement('h1', { className: 'title' }, '📚 Репетитор'),
                renderAddForm(),
                React.createElement(
                    Calendar,
                    {
                        students: students,
                        notes: calendarNotes,
                        currentDate: calendarDate,
                        onMonthChange: setCalendarDate,
                        onDateClick: handleDateClick
                    }
                ),
                React.createElement('div', { className: 'subtitle' }, 'Ученики'),
                renderStudentList(),
                renderStudentCard(),
                dayModalElement
            );
        }

        // ============================================================
        // 9. ЗАПУСК
        // ============================================================
        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App, null));
    </script>
</body>
</html>
